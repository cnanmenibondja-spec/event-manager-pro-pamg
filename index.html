    if (v === 'home' && isOrg()) ui.evOpen = false; else if (EV_VIEWS.indexOf(v) >= 0) ui.evOpen = true;
    closeSide(); render(); window.scrollTo(0, 0);
  }
  function goTarget(g) { if (!g) return; if (g.indexOf('team:') === 0) go(isOrg() ? 'team' : 'myteam', g.slice(5)); else go(g); }

  /* ---------- Vue : liste des événements ---------- */
  function vHome() {
    if (ON.on) return vEvents();
    var evs = state.events.slice().sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    var up = evs.filter(function (e) { return phase(e) !== 'after'; }), past = evs.filter(function (e) { return phase(e) === 'after'; });
    var h = vhead('Tableau de bord', 'Tous vos événements en un coup d\'œil. Cliquez sur un événement pour voir tous ses détails.', isOrg() ? btn('+ Nouvel événement', 'new-event', 'btn-gold btn-lg') : '');
    if (!evs.length) return h + '<div class="card new-ev-empty"><h2>Aucun événement pour le moment</h2><p class="muted">Créez votre premier événement : l\'application propose déjà les équipes et les missions habituelles.</p><div class="mt">' + btn('+ Créer mon premier événement', 'new-event', 'btn-gold btn-lg') + '</div></div>';
    var live = evs.filter(function (e) { return phase(e) === 'live'; }).length;
    h += '<div class="kpis"><div class="kpi"><b>' + up.filter(function (e) { return phase(e) === 'before'; }).length + '</b><span>à venir</span></div>' +
      '<div class="kpi' + (live ? ' gold' : '') + '"><b>' + live + '</b><span>en cours aujourd\'hui</span></div>' +
      '<div class="kpi"><b>' + past.length + '</b><span>terminé(s)</span></div><div class="kpi"><b>' + evs.length + '</b><span>au total</span></div></div>';
    function rowsOf(list) {
      return '<div class="evlist">' + list.map(function (ev) {
        var p = evProg(ev), r = readiness(ev), ph = phase(ev), d = diffDays(today(), ev.start), dd = parseD(ev.start);
        var chip = ph === 'before' ? '<span class="chip gold">J-' + d + '</span>' : ph === 'live' ? '<span class="chip bad">En cours</span>' : '<span class="chip">Terminé</span>';
        var ready = r.ready ? '<span class="chip ok">✓ Prêt</span>' : '<span class="chip">' + r.green + '/' + r.n + ' OK</span>';
        return '<div class="evrow" data-act="open-event" data-id="' + ev.id + '" tabindex="0" role="button">' +
          '<div class="evdate"><b>' + dd.getDate() + '</b><span>' + dd.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') + ' ' + String(dd.getFullYear()).slice(2) + '</span></div>' +
          '<div class="evmain"><b>' + esc(ev.name) + '</b><small>' + esc(EV_TYPES[ev.type] || 'Événement') + (ev.place ? ' · ' + esc(ev.place) : '') + '</small></div>' +
          '<div class="evprog">' + bar(p) + '<small>' + p + ' % préparé</small></div>' + chip + ready +
          (isOrg() ? '<button class="icon-btn ev-edit" data-act="edit-event" data-id="' + ev.id + '" aria-label="Modifier l\'événement" title="Modifier l\'événement (nom, dates, lieu…)">✎</button>' : '') + '<span class="evgo" aria-hidden="true">›</span></div>';
      }).join('') + '</div>';
    }
    if (up.length) h += '<div class="card mt"><h2>À venir et en cours</h2>' + rowsOf(up) + '</div>';
    if (past.length) h += '<div class="card mt"><h2>Terminés</h2>' + rowsOf(past.reverse()) + '</div>';
    return h;
  }

  /* ---------- Vue : tableau de bord de l'organisateur ---------- */
  function vDash(ev) {
    var p = evProg(ev), r = readiness(ev), ph = phase(ev), d = diffDays(today(), ev.start);
    var doneM = ev.missions.filter(function (m) { return mProg(m) >= 100; }).length;
    var spent = sum(ev.expenses, 'amount'), pl = planned(ev);
    var reg = ev.participants.filter(function (x) { return x.registered; }).length;
    var openInc = ev.incidents.filter(function (i) { return i.status !== 'resolu'; }).length;
    var when = ph === 'before' ? '<span>Début <b>' + (d === 0 ? "aujourd'hui" : 'dans ' + d + ' jour' + (d > 1 ? 's' : '')) + '</b></span>' : ph === 'live' ? '<span><b>L\'événement a lieu maintenant</b></span>' : '<span>Événement terminé</span>';
    var h = '<section class="hero"><div class="hero-l"><span class="eyebrow">' + esc(EV_TYPES[ev.type] || 'Événement') + '</span><h1>' + esc(ev.name) + '</h1>' +
      '<p>' + fmtDate(ev.start, true) + (ev.end && ev.end !== ev.start ? ' → ' + fmtDate(ev.end, true) : '') + (ev.place ? ' · ' + esc(ev.place) : '') + '</p>' +
      '<div class="hero-meta">' + when + (ev.okDeadline ? '<span>OK des chefs attendu le <b>' + fmtDate(ev.okDeadline) + '</b> (' + rel(ev.okDeadline) + ')</span>' : '') + '</div>' +
      '<div class="hero-acts">' + btn('✎ Modifier l\'événement', 'edit-event', 'btn-gold btn-sm', ' data-id="' + ev.id + '"') + '</div></div>' + ring(p) + '</section>';

    if (r.n === 0) h += '<div class="banner wait">Ajoutez vos équipes et leurs chefs pour commencer.<span class="acts">' + btn('+ Ajouter une équipe', 'new-team', 'btn-primary btn-sm') + '</span></div>';
    else if (r.ready) h += '<div class="banner ok"><span class="big">✓</span>Feu vert : toutes les équipes ont donné leur OK' + (r.acc ? ' (' + r.acc + ' avec une réserve acceptée)' : '') + '. L\'événement peut avoir lieu sereinement.</div>';
    else if (r.readyRes) h += '<div class="banner warn"><span class="big">!</span>Toutes les équipes ont répondu, mais ' + r.res + ' réserve(s) attendent votre décision. Acceptez-les ou refusez-les pour donner le feu vert.</div>';
    else h += '<div class="banner wait"><span class="big">⏳</span>Feu vert : ' + r.green + ' équipe(s) sur ' + r.n + ' ont un OK validé' + (r.res ? ', ' + r.res + ' réserve(s) à valider' : '') + '. On attend encore ' + r.wait + ' équipe(s).<span class="acts">' + btn('Partager l\'état par WhatsApp', 'share-status', 'btn-sm') + '</span></div>';

    h += '<div class="kpis">' +
      '<div class="kpi"><b>' + doneM + '/' + ev.missions.length + '</b><span>missions terminées</span></div>' +
      '<div class="kpi' + (r.ready ? ' gold' : '') + '"><b>' + r.green + '/' + r.n + '</b><span>équipes ont un OK validé</span></div>' +
      '<div class="kpi"><b>' + fmtMoney(spent) + '</b><span>dépensés' + (pl ? ' sur ' + fmtMoney(pl) + ' prévus' : '') + '</span></div>' +
      (ph === 'before' ? '<div class="kpi"><b>' + reg + (ev.expected ? '/' + ev.expected : '') + '</b><span>inscrits' + (ev.expected ? ' / attendus' : '') + '</span></div>'
        : '<div class="kpi"><b>' + openInc + '</b><span>incident(s) ouvert(s)</span></div>') + '</div>';

    var teamsHtml = ev.teams.length ? ev.teams.map(function (t) {
      var tp = tProg(ev, t.id), n = teamMissions(ev, t.id).length;
      return '<div class="trow" data-act="open-team" data-id="' + t.id + '"><span class="dot" style="background:' + esc(t.color) + '"></span><div class="trow-main"><b>' + esc(t.name) + '</b>' +
        '<small>Chef : ' + (t.lead ? esc(t.lead) : '<em>à désigner</em>') + ' · ' + n + ' mission' + (n > 1 ? 's' : '') + (teamFiles(ev, t.id).length ? ' · 📎 ' + teamFiles(ev, t.id).length : '') + '</small>' + bar(tp) + '</div>' + miniRing(tp, tStatus(t)) + okChip(t) + '</div>';
    }).join('') : empty('Pas encore d\'équipe.');

    var al = alertsFor(ev);
    var alHtml = al.length ? al.slice(0, 9).map(function (a) {
      return '<div class="alert ' + a.l + '" data-act="go-target" data-g="' + esc(a.go) + '"><span class="ic">' + (a.l === 'bad' ? '!' : a.l === 'warn' ? '!' : 'i') + '</span><span>' + esc(a.x) + '</span></div>';
    }).join('') + (al.length > 9 ? '<p class="muted small mt">… et ' + (al.length - 9) + ' autre(s) point(s).</p>' : '') : empty('Rien à signaler. Tout avance comme prévu.');

    var next = ev.missions.filter(function (m) { return mProg(m) < 100 && m.deadline; }).sort(function (a, b) { return a.deadline < b.deadline ? -1 : 1; }).slice(0, 6);
    var nextHtml = next.length ? next.map(function (m) {
      return '<div class="mrow" data-act="open-team" data-id="' + m.teamId + '"><div class="mr-main"><b>' + esc(m.title) + '</b><small>' + esc((teamOf(ev, m.teamId) || {}).name || '') + '</small></div>' + dlChip(m) + '</div>';
    }).join('') : empty('Aucune échéance à venir.');

    var feed = ev.log.length ? '<ul class="feed">' + ev.log.slice(0, 8).map(function (l) { return '<li><b>' + esc(l.who) + '</b> ' + esc(l.text) + '<small>' + fmtStamp(l.at) + '</small></li>'; }).join('') + '</ul>' : empty('Encore aucune activité.');

    h += meetingsStrip(ev, null);
    h += '<div class="grid g2 mt"><div class="card"><h2>Feu vert des équipes <span class="acts">' + btn('Voir les équipes', 'go', 'btn-sm', ' data-v="teams"') + '</span></h2>' + teamsHtml + '</div>' +
      '<div class="card"><h2>À surveiller</h2>' + alHtml + '</div>' +
      '<div class="card"><h2>Prochaines échéances</h2>' + nextHtml + '</div>' +
      '<div class="card"><h2>Ce qui s\'est passé</h2>' + feed + '</div></div>';
    return h;
  }

  /* ---------- Vue : équipes ---------- */
  function vTeams(ev) {
    var h = vhead('Équipes de l\'événement', 'Les équipes qui servent pour « ' + esc(ev.name) + ' ». Ajoutez une équipe habituelle ou une nouvelle, ou retirez-en une (bouton « Modifier l\'équipe »).', btn('+ Ajouter une équipe', 'add-ev-team', 'btn-primary'));
    if (!ev.teams.length) return h + empty('Pas encore d\'équipe. Cliquez sur « + Ajouter une équipe » pour choisir parmi vos équipes habituelles.');
    h += '<div class="grid g3">' + ev.teams.map(function (t) {
      var tp = tProg(ev, t.id), ms = teamMissions(ev, t.id);
      var subs = sum(ms, function (m) { return m.subtasks.length; }), dn = sum(ms, function (m) { return m.subtasks.filter(function (s) { return s.done; }).length; });
      return '<div class="card team-card" style="border-top-color:' + esc(t.color) + '" data-act="open-team" data-id="' + t.id + '"><div class="tc-top"><h3>' + esc(t.name) + '</h3>' + miniRing(tp, tStatus(t)) + okChip(t) + '</div>' +
        '<div class="tc-meta"><b>Chef :</b> ' + (t.lead ? esc(t.lead) : '<span class="chip warn">à désigner</span>') + (t.phone ? ' · ' + esc(t.phone) : '') + '</div>' +
        '<div class="tc-meta muted">' + (t.people.length ? '👥 ' + t.people.length + ' membre' + (t.people.length > 1 ? 's' : '') + ' : ' + esc(t.people.slice(0, 4).map(function (p) { return p.name; }).join(', ')) + (t.people.length > 4 ? '…' : '') : 'Pas encore de membres') + '</div>' + bar(tp) +
        '<div class="tc-foot"><b style="color:var(--ink)">' + tp + ' %</b><span>' + ms.length + ' mission(s) · ' + dn + '/' + subs + ' tâches faites' + (teamFiles(ev, t.id).length ? ' · 📎 ' + teamFiles(ev, t.id).length + ' document(s)' : '') + '</span></div></div>';
    }).join('') + '</div>';
    return h;
  }

  /* ---------- Vue : équipes habituelles (catalogue commun à tous les événements) ---------- */
  function vCatalog() {
    var h = vhead('Équipes habituelles', 'Vos équipes de service, d\'un événement à l\'autre, avec leur chef et leurs membres. En créant un événement, vous cochez celles qui participent. Ce que vous changez dans un événement ne modifie pas cette liste.', btn('+ Nouvelle équipe habituelle', 'new-cat', 'btn-primary'));
    if (!catList().length) return h + empty('Aucune équipe habituelle pour le moment.');
    h += '<div class="grid g3">' + catList().map(function (c) {
      var used = state.events.filter(function (e) { return teamByCat(e, c.id); }).length;
      return '<div class="card team-card" style="border-top-color:' + esc(c.color) + '" data-act="edit-cat" data-id="' + c.id + '" tabindex="0" role="button"><div class="tc-top"><h3>' + esc(c.name) + '</h3>' + (c.tpl ? '<span class="chip">Missions types</span>' : '') + '</div>' +
        '<div class="tc-meta"><b>Chef :</b> ' + (c.lead ? esc(c.lead) : '<span class="chip warn">à désigner</span>') + (c.phone ? ' · ' + esc(c.phone) : '') + '</div>' +
        '<div class="tc-meta muted">' + (c.people.length ? '👥 ' + esc(c.people.slice(0, 5).map(function (p) { return p.name; }).join(', ')) + (c.people.length > 5 ? '…' : '') : 'Pas encore de membres habituels') + '</div>' +
        '<div class="tc-foot"><span>Dans ' + used + ' événement' + (used > 1 ? 's' : '') + '</span><span>✎ Modifier</span></div></div>';
    }).join('') + '</div>';
    return h;
  }

  /* ---------- Vue : une équipe (organisateur) ou mon équipe (chef / membre) ---------- */
  function vTeam(ev) {
    var tid = isOrg() ? ui.teamId : myTeam();
    var t = teamOf(ev, tid);
    if (!t && !isOrg() && ON.on && !state.role.catId) return vhead('Mon équipe', esc(ev.name)) + '<div class="card new-ev-empty"><h2>Vous n\'êtes dans aucune équipe pour l\'instant</h2><p class="muted">Demandez à l\'organisateur un lien d\'invitation pour votre équipe, ou qu\'il vous ajoute dans « Personnes et invitations ».</p></div>';
    if (!t && !isOrg()) {
      var c = catOf(state.role.catId);
      return vhead('Mon équipe', esc(ev.name)) + '<div class="card new-ev-empty"><h2>Votre équipe ne participe pas à cet événement</h2><p class="muted">L\'équipe « ' + esc(c ? c.name : '') + ' » n\'a pas été choisie pour « ' + esc(ev.name) + ' ». Choisissez un autre événement dans le menu « Événement », ou demandez à l\'organisateur de l\'ajouter.</p></div>';
    }
    if (!t) { ui.view = 'teams'; return vTeams(ev); }
    var ms = teamMissions(ev, tid), tp = tProg(ev, tid), st = tStatus(t), lead = isLead() && canEditTeam(tid);
    var acts = isOrg() ? btn('+ Attribuer une mission', 'new-mission', 'btn-primary', ' data-team="' + tid + '"') + btn('Modifier l\'équipe', 'edit-team', '', ' data-id="' + tid + '"')
      : btn('Partager où on en est', 'share-team', '', ' data-id="' + tid + '"');
    if (ON.on && isOrg()) acts += btn('🔗 Inviter', 'cl-invite', '', ' data-cat="' + (t.catId || '') + '" data-role="lead" data-lead="' + esc(t.lead || '') + '"');
    var h = vhead(isOrg() ? t.name : 'Mon équipe : ' + t.name,
      (t.lead ? 'Chef : <b>' + esc(t.lead) + '</b>' : 'Chef à désigner') + ' · ' + (t.people.length + 1) + ' personne' + (t.people.length ? 's' : '') + ' avec le chef' + ' · ' + esc(ev.name) + (isMember() ? ' · <b>vous êtes membre</b> : vous cochez vos tâches' : ''), acts, isOrg() ? ['teams', 'Toutes les équipes'] : null);

    h += '<div class="grid g2"><div class="card"><div class="okbox">' + ring(tp, true) + '<div style="flex:1;min-width:200px">' +
      '<p class="muted small">' + ms.length + ' mission(s) · ' + sum(ms, function (m) { return m.subtasks.filter(function (s) { return s.done; }).length; }) + '/' + sum(ms, function (m) { return m.subtasks.length; }) + ' tâches faites</p>' +
      (ev.okDeadline ? '<p class="muted small">OK attendu avant le <b>' + fmtDate(ev.okDeadline, true) + '</b></p>' : '') + '</div></div></div>' +
      '<div class="card">' + okCard(ev, t, tp, st, lead) + '</div></div>';

    var al = alertsFor(ev, tid).filter(function (a) { return a.l !== 'info'; });
    if (al.length) h += '<div class="card mt"><h2>À surveiller</h2>' + al.map(function (a) { return '<div class="alert ' + a.l + '"><span class="ic">!</span><span>' + esc(a.x) + '</span></div>'; }).join('') + '</div>';

    h += meetingsStrip(ev, tid);
    h += membersCard(ev, t);
    h += filesCard(ev, t);
    h += '<div class="sec-head"><h2>Missions <span class="chip">' + ms.length + '</span></h2>' + (canEditTeam(tid) ? btn('+ Ajouter une mission', 'new-mission', 'btn-gold', ' data-team="' + tid + '"') : '') + '</div>';
    if (!ms.length) h += empty('Aucune mission pour cette équipe.' + (canEditTeam(tid) ? ' Cliquez sur « + Ajouter une mission ».' : ''));
    else h += ms.slice().sort(function (a, b) { return (a.deadline || '9') < (b.deadline || '9') ? -1 : 1; }).map(function (m) { return missionCard(ev, m, false); }).join('');
    if (ms.length && canEditTeam(tid)) h += '<div style="text-align:center;margin:4px 0 8px">' + btn('+ Ajouter une autre mission', 'new-mission', '', ' data-team="' + tid + '"') + '</div>';
    if (!isMember()) h += financeCard(ev, t); // un membre ne voit aucun montant
    if (!isOrg()) h += potCard(ev);
    if (lead) h += '<div class="tip mt">Astuce : découpez chaque mission en petites tâches concrètes (« acheter les assiettes », « tester le micro »). L\'organisateur voit le pourcentage avancer à chaque tâche cochée.</div>';
    return h;
  }

  /* Le OK du chef : vert seulement à 100 %. Avant, OK avec réserve (orange) : pour chaque tâche pas finie, pourquoi et la solution prévue. */
  function okCard(ev, t, tp, st, lead) {
    var tid = t.id, left = openItems(ev, tid), h = '<div class="okbox">' + miniRing(tp, st) + '<div class="okinfo">';
    var resList = function () {
      var it = (t.ok && t.ok.items) || [];
      return (it.length ? '<ul class="res-items">' + it.map(function (x) { return '<li><b>' + esc(x.title) + '</b><span><em>Pourquoi :</em> ' + esc(x.why) + '</span><span><em>Solution :</em> ' + esc(x.fix) + '</span></li>'; }).join('') + '</ul>' : '') +
        (t.ok && t.ok.note ? '<p class="small">« ' + esc(t.ok.note) + ' »</p>' : '');
    };
    if (st === 'wait') {
      h += '<h3>' + (isOrg() ? 'En attente du OK de ' + esc(t.lead || 'ce chef') : tp >= 100 ? 'Tout est prêt ✓' : 'Pas encore tout fini') + '</h3>';
      if (t.refused) h += '<div class="alert bad"><span class="ic">!</span><span>Réserve refusée par l\'organisateur le ' + fmtStamp(t.refused.at) + (t.refused.note ? ' : « ' + esc(t.refused.note) + ' »' : '') + '</span></div>';
      h += '<p class="muted small">' + (tp >= 100 ? 'Toutes les tâches sont faites.' : 'Encore <b>' + left.length + ' tâche' + (left.length > 1 ? 's' : '') + '</b> à finir. Le OK vert est possible quand tout est vert.') + '</p></div></div>';
      if (isOrg()) h += '<div class="m-actions">' + btn('Relancer par WhatsApp', 'remind-team', '', ' data-id="' + tid + '"') + '</div>';
      else if (lead) h += '<div class="m-actions">' + (tp >= 100 ? btn('✓ Envoyer mon OK', 'send-ok', 'btn-ok btn-lg', ' data-id="' + tid + '"')
        : '<button class="btn btn-lg btn-off" disabled title="Possible à 100 %">✓ OK (encore ' + left.length + ' tâche' + (left.length > 1 ? 's' : '') + ')</button>' + btn('OK avec réserve', 'send-reserve', 'btn-reserve btn-lg', ' data-id="' + tid + '"')) + '</div>';
      else h += '<p class="muted small">C\'est le chef d\'équipe qui envoie le OK.</p>';
      return h;
    }
    if (st === 'ok') {
      h += '<h3>✓ OK envoyé</h3><p class="muted small">Le ' + fmtStamp(t.ok.at) + ' · tout est prêt.</p></div></div>';
    } else {
      h += '<h3>' + (st === 'reserveok' ? '✓ OK avec réserve acceptée' : 'OK avec réserve : en attente de l\'organisateur') + '</h3><p class="muted small">Envoyé le ' + fmtStamp(t.ok.at) +
        (st === 'reserveok' ? ' · accepté le ' + fmtStamp(t.ok.acceptedAt) : '') + '</p></div></div>' + resList();
      if (isOrg() && st === 'reserve') h += '<div class="m-actions">' + btn('✓ Accepter la réserve', 'accept-res', 'btn-ok', ' data-id="' + tid + '"') + btn('Refuser', 'refuse-res', 'btn-danger', ' data-id="' + tid + '"') + '</div>';
      if (lead && tp >= 100) h += '<div class="m-actions">' + btn('Tout est fini : envoyer le OK complet', 'send-ok', 'btn-ok', ' data-id="' + tid + '"') + '</div>';
    }
    if (lead) h += '<div class="m-actions">' + btn('Prévenir l\'organisateur (WhatsApp)', 'wa-ok', '', ' data-id="' + tid + '"') + btn('Retirer mon OK', 'cancel-ok', 'btn-ghost', ' data-id="' + tid + '"') + '</div>';
    return h;
  }

  /* Budget de l'équipe : ce qui est accordé, ce qui est dépensé, les achats et les tickets. */
  function financeCard(ev, t) {
    var f = teamFin(ev, t), edit = canEditTeam(t.id), xs = teamExpenses(ev, t.id).slice().sort(function (a, b) { return (b.date || '') < (a.date || '') ? -1 : 1; });
    var h = '<div class="card mt fin-card' + (t.fin ? ' is-fin' : '') + '"><h2>Budget & dépenses de l\'équipe' + (edit ? '<span class="acts">' + btn('+ Ajouter une dépense', 'new-exp', 'btn-primary btn-sm', ' data-team="' + t.id + '"') + '</span>' : '') + '</h2>';
    h += '<div class="kpis mini"><div class="kpi"><b>' + fmtMoney(f.req) + '</b><span>demandé</span></div><div class="kpi' + (f.hasAlloc ? ' gold' : '') + '"><b>' + (f.hasAlloc ? fmtMoney(f.alloc) : '—') + '</b><span>accordé par l\'organisateur</span></div>' +
      '<div class="kpi"><b>' + fmtMoney(f.spent) + '</b><span>dépensé</span></div><div class="kpi"><b style="color:' + (f.left >= 0 ? 'var(--green)' : 'var(--red)') + '">' + (f.hasAlloc ? fmtMoney(f.left) : '—') + '</b><span>reste</span></div></div>';
    h += '<h3 class="sub-h">Budget par mission</h3>' + moneyTable(ev, t) + (t.alloc != null ? '<p class="small">Enveloppe accordée à toute l\'équipe : <b>' + fmtMoney(t.alloc) + '</b>' + (isOrg() ? ' ' + btn('✎', 'set-alloc', 'btn-sm', ' data-id="' + t.id + '" title="Modifier l\'enveloppe"') : '') + '</p>' : '');
    h += '<h3 class="sub-h">Achats</h3>' + (xs.length ? '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Quoi</th><th>Payé par</th><th class="num">Montant</th><th class="c">Ticket</th></tr></thead><tbody>' + xs.map(function (x) {
      return '<tr><td>' + (edit ? '<a href="#" data-act="edit-exp" data-id="' + x.id + '"><b>' + esc(x.what) + '</b></a>' : '<b>' + esc(x.what) + '</b>') + '<br><small class="muted">' + fmtDate(x.date) + '</small></td><td>' + esc(x.who) + (x.reimbursed ? '<br><small class="muted">remboursé</small>' : '') + '</td><td class="num">' + fmtMoney(x.amount) + '</td>' +
        '<td class="c">' + (x.receiptId ? btn('📷 Voir', 'receipt', 'btn-sm', ' data-id="' + x.id + '"') : '—') + '</td></tr>';
    }).join('') + '</tbody><tfoot><tr><td colspan="2">Total</td><td class="num">' + fmtMoney(f.spent) + '</td><td></td></tr></tfoot></table></div>' : empty('Aucun achat noté pour le moment.'));
    if (t.fin) h += '<div class="banner ok mt"><span class="big">✓</span>Comptes complets, envoyés le ' + fmtStamp(t.fin.at) + (t.fin.by ? ' par ' + esc(t.fin.by) : '') + '.' + (edit ? '<span class="acts">' + btn('Rouvrir les comptes', 'fin-reopen', 'btn-sm', ' data-id="' + t.id + '"') + '</span>' : '') + '</div>';
    else if (edit) h += '<div class="m-actions mt">' + btn('✓ Mes comptes sont complets', 'fin-done', 'btn-ok', ' data-id="' + t.id + '"') + '<span class="muted small">Quand tous les achats et tickets sont notés. L\'organisateur verra l\'équipe en vert dans « Budget & finances ».</span></div>';
    return h + '</div>';
  }

  /* Tableau des montants par mission, avec un bouton ✎ sur chaque montant modifiable. */
  function moneyTable(ev, t) {
    var ms = teamMissions(ev, t.id), er = canEditTeam(t.id), ea = isOrg();
    if (!ms.length) return '<p class="muted small">Aucune mission.</p>';
    return '<div class="tbl-wrap"><table class="tbl money-tbl"><thead><tr><th>Mission</th><th class="num">Demandé</th><th>Pour le</th><th class="num">Accordé</th></tr></thead><tbody>' + ms.map(function (m) {
      var req = (m.req ? fmtMoney(m.req) : '—') + (er ? ' ' + btn(m.req ? '✎ Modifier' : '€ Demander', 'edit-req', 'btn-sm' + (m.req ? '' : ' btn-gold'), ' data-m="' + m.id + '" title="Saisir ou modifier le montant demandé"') : '');
      var al = (m.alloc != null ? '<b style="color:var(--green)">' + fmtMoney(m.alloc) + '</b>' : m.req ? '<span style="color:var(--amber)">en attente</span>' : '—') +
        (ea ? ' ' + btn(m.alloc != null ? '✎ Modifier' : '€ Accorder', 'edit-alloc', 'btn-sm' + (m.alloc == null && m.req ? ' btn-gold' : ''), ' data-m="' + m.id + '" title="Saisir ou modifier le montant accordé"') : '');
      return '<tr><td>' + esc(m.title) + '</td><td class="num">' + req + '</td><td>' + (m.reqDate ? fmtDate(m.reqDate) : '—') + '</td><td class="num">' + al + '</td></tr>';
    }).join('') + '</tbody></table></div>' + (er ? '<p class="muted small">' + (ea ? 'Les boutons de la colonne « Demandé » changent la demande de l\'équipe, ceux de la colonne « Accordé » le montant que vous donnez.' : 'Le bouton de la colonne « Demandé » vous permet de donner ou changer votre montant. Le montant accordé est fixé par l\'organisateur.') + '</p>' : '');
  }

  /* Cagnotte de l'événement : lien PayPal, objectif et total reçu. */
  function potCard(ev) {
    // En ligne, un chef ou un membre ne voit pas la liste des dons : seulement le total calculé chez l'organisateur.
    var recs = ev.contributions.filter(function (c) { return c.status === 'recu'; }), hide = ON.on && !recs.length;
    if (isMember()) return '<div class="card mt pot"><h2>Cagnotte de l\'événement</h2><div class="pot-row"><div class="pot-main"><p class="muted">Chacun peut participer aux frais de l\'événement.</p></div><div class="m-actions">' + btn('💛 Contribuer', 'contribute', 'btn-gold btn-lg') + (ev.paypal ? btn('Partager le lien', 'share-pot', '') : '') + '</div></div></div>';
    var rec = hide ? Number(ev.potTotal) || 0 : sum(recs, 'amount'), nRec = hide ? Number(ev.potCount) || 0 : recs.length, goal = Number(ev.goal) || 0;
    var h = '<div class="card mt pot"><h2>Cagnotte de l\'événement</h2><div class="pot-row"><div class="pot-main"><p><b class="big-num">' + fmtMoney(rec) + '</b> reçus' + (goal ? ' sur un objectif de <b>' + fmtMoney(goal) + '</b>' : '') + '</p>' +
      (goal ? bar(Math.round(rec / goal * 100)) : '') + '<small class="muted">' + nRec + ' contribution(s)</small></div>' +
      '<div class="m-actions">' + btn('💛 Contribuer', 'contribute', 'btn-gold btn-lg') + (ev.paypal ? btn('Partager le lien', 'share-pot', '') : '') + '</div></div>';
    if (isTreasurer(ev)) h += quickContrib();
    return h + '</div>';
  }
  function quickContrib() {
    return '<form class="add-member quick-contrib" data-form="add-contrib"><input name="who" placeholder="Nom de la personne" aria-label="Nom"><input name="amount" inputmode="decimal" placeholder="Montant reçu (€)" aria-label="Montant"><button class="btn btn-primary btn-sm" type="submit">+ Noter un don reçu</button></form>';
  }

  function membersCard(ev, t) {
    var edit = canEditTeam(t.id), ms = teamMissions(ev, t.id);
    var tasksOf = function (name) {
      var n = 0, d = 0, low = name.toLowerCase();
      ms.forEach(function (m) { m.subtasks.forEach(function (s) { if (s.who && s.who.toLowerCase() === low) { n++; if (s.done) d++; } }); });
      return n ? d + '/' + n + ' tâche' + (n > 1 ? 's' : '') : '';
    };
    var contact = function (phone) {
      return phone ? '<a class="btn btn-sm" href="tel:' + esc(phone.replace(/[^\d+]/g, '')) + '">Appeler</a>' + btn('WhatsApp', 'wa-person', 'btn-sm', ' data-phone="' + esc(phone) + '"') : '';
    };
    var h = '<div class="card mt"><h2>Membres de l\'équipe <span class="chip">' + (t.people.length + (t.lead ? 1 : 0)) + '</span>' +
      (isOrg() ? '<span class="acts">' + btn('👑 Choisir le chef', 'pick-lead', 'btn-gold btn-sm', ' data-id="' + t.id + '"') + '</span>' : '') + '</h2>' +
      (isOrg() ? '' : '<p class="muted small" style="margin:-6px 0 8px">Seul l\'organisateur choisit le chef d\'équipe.' + (edit ? ' Vous pouvez ajouter et modifier les membres.' : '') + '</p>') + '<ul class="members">';
    h += '<li class="is-lead"><span class="avatar" style="background:' + esc(t.color) + '">' + esc((t.lead || '?').charAt(0).toUpperCase()) + '</span><div class="pmain"><b>' + (t.lead ? esc(t.lead) : '<em>Chef à désigner</em>') + ' <span class="chip gold">Chef d\'équipe</span></b>' +
      '<small>' + (t.phone ? esc(t.phone) : 'Pas de téléphone') + (tasksOf(t.lead || '') ? ' · ' + tasksOf(t.lead) : '') + '</small></div>' + contact(t.phone) + '</li>';
    h += t.people.map(function (p) {
      var tk = tasksOf(p.name);
      return '<li><span class="avatar">' + esc(p.name.charAt(0).toUpperCase()) + '</span><div class="pmain"><b>' + esc(p.name) + '</b><small>' + (p.role ? esc(p.role) : 'Rôle à préciser') + (p.phone ? ' · ' + esc(p.phone) : '') + (tk ? ' · ' + tk : '') + '</small></div>' +
        contact(p.phone) + (edit ? '<button class="icon-btn" data-act="edit-member" data-team="' + t.id + '" data-id="' + p.id + '" aria-label="Modifier" title="Modifier">✎</button>' : '') + '</li>';
    }).join('') + '</ul>';
    if (!t.people.length) h += '<p class="muted small" style="margin-top:6px">Pas encore de membres dans cette équipe.</p>';
    if (edit) h += '<form class="add-member" data-form="add-member" data-team="' + t.id + '"><input name="name" placeholder="Nom du membre" aria-label="Nom du membre"><input name="role" placeholder="Son rôle (facultatif)" aria-label="Rôle"><input name="phone" type="tel" placeholder="Téléphone (facultatif)" aria-label="Téléphone"><button class="btn btn-primary btn-sm" type="submit">+ Ajouter</button></form>';
    return h + '</div>';
  }

  function filesCard(ev, t) {
    var fs = teamFiles(ev, t.id), edit = canEditTeam(t.id);
    var h = '<div class="card mt"><h2>Présentations & documents' + (edit ? '<span class="acts"><label class="btn btn-primary btn-sm upload">⬆ Déposer un fichier<input type="file" multiple data-chg="upload" data-team="' + t.id + '"></label></span>' : '') + '</h2>';
    h += '<p class="muted small" style="margin:-6px 0 10px">' + (isOrg() ? 'Le chef d\'équipe dépose ici sa présentation (PowerPoint, PDF, Keynote, Word, images…). Vous pouvez l\'ouvrir ou la télécharger.' : 'Déposez ici la présentation de votre équipe (PowerPoint, PDF, Keynote, Word, images…). L\'organisateur pourra l\'ouvrir et la télécharger.') + '</p>';
    if (!fs.length) h += empty('Aucun document pour le moment.');
    else h += '<ul class="files">' + fs.slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; }).map(function (f) {
      var ext = fileExt(f.name), viewable = /^(pdf|png|jpe?g|gif|webp|mp4|mov|txt)$/.test(ext);
      return '<li><span class="fic">' + esc(ext.slice(0, 4)) + '</span><div class="fmain"><b title="' + esc(f.name) + '">' + esc(f.name) + '</b><small>' + fmtSize(f.size) + ' · déposé par ' + esc(f.by || '—') + ' · ' + fmtStamp(f.at) + '</small></div>' +
        (viewable ? btn('Ouvrir', 'file-open', 'btn-sm', ' data-id="' + f.id + '"') : '') + btn('⬇ Télécharger', 'file-dl', 'btn-sm', ' data-id="' + f.id + '"') +
        (edit ? '<button class="icon-btn" data-act="file-del" data-id="' + f.id + '" aria-label="Supprimer" title="Supprimer">🗑</button>' : '') + '</li>';
    }).join('') + '</ul>';
    return h + '</div>';
  }

  function missionCard(ev, m, showTeam) {
    var p = mProg(m), edit = canEditTeam(m.teamId), tick = canTick(m.teamId), t = today();
    var h = '<article class="mission' + (p >= 100 ? ' is-done' : '') + '" id="mis-' + m.id + '"><div class="m-head"><div><h3>' + esc(m.title) + '</h3><div class="m-meta">' +
      (m.priority === 'haute' ? '<span class="chip bad">Priorité haute</span>' : m.priority === 'basse' ? '<span class="chip">Priorité basse</span>' : '') + dlChip(m) +
      moneyChips(m) + (showTeam ? teamChip(ev, m.teamId) : '') + '</div></div><div class="m-pct">' + p + ' %</div>' +
      (edit ? '<div class="m-tools"><button class="btn btn-sm" data-act="edit-mission" data-m="' + m.id + '">✎ Modifier</button><button class="icon-btn danger" data-act="del-mission" data-m="' + m.id + '" aria-label="Supprimer la mission" title="Supprimer la mission">🗑</button></div>' : '') + '</div>' + bar(p);
    if (m.desc) h += '<p class="m-desc">' + esc(m.desc) + '</p>';
    if (m.subtasks.length) {
      h += '<ul class="subs">' + m.subtasks.map(function (s) {
        return '<li class="' + (s.done ? 'done' : '') + '"><label><input type="checkbox" data-chg="sub" data-m="' + m.id + '" data-s="' + s.id + '"' + (s.done ? ' checked' : '') + (tick ? '' : ' disabled') + '><span>' + esc(s.title) + '</span></label>' +
          (s.who ? '<small>' + esc(s.who) + '</small>' : '') + (s.due ? '<small class="' + (!s.done && s.due < t ? 'late' : '') + '">' + fmtDate(s.due) + '</small>' : '') +
          (edit ? '<span class="sub-tools"><button class="icon-btn" data-act="edit-sub" data-m="' + m.id + '" data-s="' + s.id + '" aria-label="Modifier la tâche" title="Modifier la tâche">✎</button><button class="icon-btn danger" data-act="del-sub" data-m="' + m.id + '" data-s="' + s.id + '" aria-label="Supprimer la tâche" title="Supprimer la tâche">✕</button></span>' : '') + '</li>';
      }).join('') + '</ul>';
    } else {
      h += '<label class="m-solo"><input type="checkbox" data-chg="mdone" data-m="' + m.id + '"' + (m.done ? ' checked' : '') + (tick ? '' : ' disabled') + '> Mission faite (elle n\'a pas encore de tâches)</label>';
    }
    if (edit) h += '<form class="add-sub" data-form="add-sub" data-m="' + m.id + '"><input name="t" placeholder="Ajouter une tâche à faire…" aria-label="Nouvelle tâche"><button class="btn btn-sm" type="submit">Ajouter</button></form>';
    if (m.question) {
      h += '<div class="qa"><div class="q"><b>Question à l\'organisateur</b>' + esc(m.question) + '</div>' +
        (m.answer ? '<div class="a"><b>Réponse</b>' + esc(m.answer) + '</div>' : '<div class="a none">En attente de réponse</div>') + '</div>';
    }
    h += '<div class="m-actions">';
    if (isOrg()) {
      if (m.question) h += btn(m.answer ? 'Modifier la réponse' : 'Répondre', 'answer', m.answer ? 'btn-sm' : 'btn-gold btn-sm', ' data-m="' + m.id + '"');
      h += btn('Envoyer au chef (WhatsApp)', 'wa-mission', 'btn-sm', ' data-m="' + m.id + '"');
    } else if (edit) {
      h += btn(m.question ? 'Changer ma question' : 'Poser une question', 'ask', 'btn-sm', ' data-m="' + m.id + '"');
    }
    return h + '</div></article>';
  }

  /* ---------- Vue : toutes les missions ---------- */
  function vMissions(ev) {
    var h = vhead('Missions & tâches', 'L\'organisateur attribue une mission à une équipe. Le chef la découpe en tâches. Cliquez sur une mission pour voir le détail.', btn('+ Attribuer une mission', 'new-mission', 'btn-primary'));
    var t = today();
    var F = { all: 'Toutes', late: 'En retard', plan: 'Pas encore découpées', q: 'Questions ouvertes', done: 'Terminées' };
    var test = {
      all: function () { return true; }, late: function (m) { return mProg(m) < 100 && m.deadline && m.deadline < t; }, plan: function (m) { return !m.subtasks.length && !m.done; },
      q: function (m) { return m.question && !m.answer; }, done: function (m) { return mProg(m) >= 100; }
    };
    h += '<div class="filters">' + Object.keys(F).map(function (k) {
      var n = ev.missions.filter(test[k]).length;
      return '<button class="' + (ui.mFilter === k ? 'on' : '') + '" data-act="mfilter" data-f="' + k + '">' + F[k] + ' (' + n + ')</button>';
    }).join('') + '</div>';
    var list = ev.missions.filter(test[ui.mFilter] || test.all);
    if (!list.length) return h + empty('Aucune mission dans cette liste.');
    ev.teams.concat([{ id: '', name: 'Sans équipe', color: '#999' }]).forEach(function (tm) {
      var ms = list.filter(function (m) { return (m.teamId || '') === tm.id || (!tm.id && !teamOf(ev, m.teamId)); });
      if (!ms.length) return;
      h += '<div class="card mt"><h2><span class="dot" style="background:' + esc(tm.color) + '"></span>' + esc(tm.name) + (tm.lead ? ' <span class="muted small" style="font-family:var(--f-body);font-weight:500">· ' + esc(tm.lead) + '</span>' : '') + '</h2>';
      ms.forEach(function (m) {
        var p = mProg(m);
        h += '<div class="mrow" data-act="toggle-mission" data-m="' + m.id + '"><div class="mr-main"><b>' + esc(m.title) + '</b><small>' + m.subtasks.filter(function (s) { return s.done; }).length + '/' + m.subtasks.length + ' tâches' + (m.question && !m.answer ? ' · question en attente' : '') + '</small></div>' +
          dlChip(m) + bar(p) + '<span class="pct">' + p + ' %</span></div>';
        if (ui.open[m.id]) h += '<div style="padding:10px 0 4px">' + missionCard(ev, m, false) + '</div>';
      });
      h += '</div>';
    });
    return h;
  }

  /* ---------- Vue : programme ---------- */
  function vProgram(ev) {
    var h = vhead('Programme', 'Le déroulé minute par minute. Chaque moment a une équipe responsable.', (isOrg() ? btn('+ Ajouter un moment', 'new-prog', 'btn-primary') : '') + btn('Imprimer', 'print', ''));
    var days = daysRange(ev.start, ev.end);
    var extra = ev.program.filter(function (p) { return days.indexOf(p.day) < 0; }).map(function (p) { return p.day; });
    days = days.concat(extra.filter(function (d, i) { return extra.indexOf(d) === i; })).sort();
    if (!ev.program.length) return h + empty('Le programme est vide. ' + (isOrg() ? 'Ajoutez le premier moment.' : 'L\'organisateur ne l\'a pas encore rempli.'));
    days.forEach(function (d, i) {
      var items = progOfDay(ev, d);
      h += '<div class="day"><h2>Jour ' + (i + 1) + ' · ' + fmtDate(d, true) + '</h2>';
      h += items.length ? '<ul class="prog prog-box">' + items.map(function (p) { return progRow(ev, p, false); }).join('') + '</ul>' : empty('Rien de prévu ce jour-là.');
      h += '</div>';
    });
    return h;
  }
  function progOfDay(ev, d) { return ev.program.filter(function (p) { return p.day === d; }).sort(function (a, b) { return a.start < b.start ? -1 : 1; }); }
  function duration(p) { var a = toMin(p.start), b = toMin(p.end); if (a == null || b == null || b <= a) return ''; var m = b - a; return (m >= 60 ? Math.floor(m / 60) + ' h ' : '') + (m % 60 ? m % 60 + ' min' : '').trim(); }
  function progRow(ev, p, live, cls) {
    return '<li class="' + (cls || '') + (p.done ? ' done' : '') + '">' + (live ? '<input type="checkbox" data-chg="prog-done" data-id="' + p.id + '"' + (p.done ? ' checked' : '') + ' aria-label="Fait">' : '') +
      '<div class="tm">' + esc(p.start) + (p.end ? ' – ' + esc(p.end) : '') + '<small>' + duration(p) + '</small></div><div class="pt"><b>' + esc(p.title) + '</b>' + (p.notes ? '<small>' + esc(p.notes) + '</small>' : '') + '</div>' +
      (p.teamId ? teamChip(ev, p.teamId) : '') + (isOrg() ? '<button class="icon-btn" data-act="edit-prog" data-id="' + p.id + '" aria-label="Modifier" title="Modifier">✎</button>' : '') + '</li>';
  }

  /* ---------- Réunions ----------
     scope : 'all' (toutes les équipes), 'teams' (équipes choisies), 'leads' (les chefs avec l'organisateur).
     Réponses (rsvp) : 'org' pour l'organisateur, 'L:<équipe>' pour un chef, l'id de la personne pour un membre. */
  var SCOPES = { all: 'Toutes les équipes', teams: 'Équipes choisies', leads: 'Les chefs d\'équipe avec l\'organisateur' };
  function mtTeams(ev, mt) { return mt.scope === 'teams' ? ev.teams.filter(function (t) { return mt.teamIds.indexOf(t.id) >= 0; }) : ev.teams.slice(); }
  function mtInvited(ev, mt, tid) { return mtTeams(ev, mt).some(function (t) { return t.id === tid; }); }
  function mtPeople(ev, mt) {
    var out = [];
    if (mt.scope !== 'teams' || !mt.byTeam) out.push({ k: 'org', name: state.orgName || 'Organisateur', role: 'Organisateur', teamId: '' });
    mtTeams(ev, mt).forEach(function (t) {
      out.push({ k: 'L:' + t.id, name: t.lead || 'Chef à désigner', role: 'Chef · ' + t.name, teamId: t.id, color: t.color });
      if (mt.scope !== 'leads') t.people.forEach(function (p) { out.push({ k: p.id, name: p.name, role: t.name, teamId: t.id, color: t.color }); });
    });
    return out;
  }
  var canEditMt = function (mt) { return isOrg() || (isLead() && !!mt.byTeam && mt.byTeam === myTeam()); };
  var canAnswer = function (p) { return isOrg() || (!!p.teamId && p.teamId === myTeam()); };
  var mtUpcoming = function (mt) { return mt.date >= today(); };
  function mtVisible(ev, mt) { return isOrg() || mtInvited(ev, mt, myTeam()) || (mt.byTeam && mt.byTeam === myTeam()); }
  function mtWhen(mt) { return fmtDate(mt.date, true) + (mt.time ? ' à ' + mt.time.replace(':', 'h') : '') + (mt.end ? ' – ' + mt.end.replace(':', 'h') : ''); }
  function mtWho(ev, mt) { return mt.scope === 'teams' ? mtTeams(ev, mt).map(function (t) { return t.name; }).join(', ') || 'aucune équipe' : SCOPES[mt.scope]; }
  function mtCount(ev, mt) {
    var ps = mtPeople(ev, mt), y = 0, n = 0;
    ps.forEach(function (p) { if (mt.rsvp[p.k] === 'yes') y++; else if (mt.rsvp[p.k] === 'no') n++; });
    return { all: ps.length, yes: y, no: n, wait: ps.length - y - n };
  }

  /* Bandeau des prochaines réunions : tableau de bord (tid = null) ou page d'une équipe invitée. */
  function meetingsStrip(ev, tid) {
    var list = (ev.meetings || []).filter(function (mt) { return mtUpcoming(mt) && (!tid || mtInvited(ev, mt, tid) || mt.byTeam === tid); })
      .sort(function (a, b) { return (a.date + a.time) < (b.date + b.time) ? -1 : 1; }).slice(0, 3);
    var can = isOrg() || (isLead() && tid && tid === myTeam());
    if (!list.length && !can) return '';
    var h = '<div class="card mt mt-strip"><h2>Prochaines réunions<span class="acts">' + (can ? btn('+ Nouvelle réunion', 'new-meeting', 'btn-sm btn-gold') : '') + btn('Toutes les réunions', 'go', 'btn-sm', ' data-v="meetings"') + '</span></h2>';
    if (!list.length) return h + '<p class="muted small">Aucune réunion prévue.</p></div>';
    return h + list.map(function (mt) {
      var c = mtCount(ev, mt), d = parseD(mt.date);
      return '<div class="evrow" data-act="open-meeting" data-id="' + mt.id + '" tabindex="0" role="button"><div class="evdate"><b>' + d.getDate() + '</b><span>' + d.toLocaleDateString('fr-FR', { month: 'short' }).replace('.', '') + '</span></div>' +
        '<div class="evmain"><b>' + esc(mt.title) + '</b><small>' + (mt.time ? mt.time.replace(':', 'h') + ' · ' : '') + esc(mt.link ? 'en visio' : mt.place || 'lieu à préciser') + ' · ' + esc(mtWho(ev, mt)) + '</small></div>' +
        '<span class="chip ok">' + c.yes + ' viennent</span>' + (c.wait ? '<span class="chip">' + c.wait + ' sans réponse</span>' : '') + '<span class="evgo" aria-hidden="true">›</span></div>';
    }).join('') + '</div>';
  }

  function vMeetings(ev) {
    var can = isOrg() || isLead();

    if (p.indexOf('00') === 0) p = p.slice(2);
    p = p.replace(/\+/g, '');
    window.open('https://wa.me/' + (p.length > 6 ? p : '') + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }
  function teamSummary(ev, t) {
    var lines = [];

      lines.push('• ' + m.title + ' : ' + mProg(m) + ' %' + (left.length ? ' (reste : ' + left.map(function (s) { return s.title; }).join(', ') + ')' : ''));
    });
    return lines.join('\n');
  }

      else teamChange(Cloud.setMember(u, { role: ts.some(function (t) { return t.role === 'lead'; }) ? 'lead' : 'member', cat_id: ts[0] ? ts[0].cat_id : null }), ts.length ? 'Cette personne n\'est plus organisateur : elle garde ses équipes.' : 'Ajoutez-lui maintenant une équipe.');
      return 'norender';
    },
    'cl-trole': function (el) {
      var u = el.getAttribute('data-u'), c = el.getAttribute('data-c'), r = el.value, cat = catOf(c);
      teamChange(Cloud.setTeam(u, c, r).then(function () { return syncMember(u); }), (r === 'lead' ? 'Chef' : 'Membre') + ' de « ' + (cat ? cat.name : '') + ' ».');
      return 'norender';
    },
    'cl-tadd': function (el) {
      var u = el.getAttribute('data-u'), c = el.value, cat = catOf(c);
      if (!c) return 'norender';
      teamChange(Cloud.setTeam(u, c, 'member').then(function () { return syncMember(u); }), 'Équipe « ' + (cat ? cat.name : '') + ' » ajoutée comme membre. Choisissez « Chef » si besoin.');
      return 'norender';
    }
  });

  /* ----- Installer l'application (téléphone, tablette, ordinateur) ----- */
  var deferredInstall = null;
  var isStandalone = function () { return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; };
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var canInstall = function () { return /^https?:$/.test(location.protocol) && !isStandalone(); };
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferredInstall = e;
    if (ui.view === 'settings' && safeNow()) render();
    var b = $('#cl-install'); if (b) b.hidden = false;
  });
  window.addEventListener('appinstalled', function () { deferredInstall = null; toast('Event Manager Pro est installée sur votre appareil.'); if (ui.view === 'settings') render(); });
  var isMacSafari = !isIOS && /Macintosh/.test(navigator.userAgent) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg|OPR|Firefox/.test(navigator.userAgent);
  var isFirefox = /Firefox/.test(navigator.userAgent);
  /* Les gestes pour installer, selon l'appareil et le navigateur utilisés. */
  function installHelp() {
    var ua = navigator.userAgent, h;
    if (isIOS) h = '<b>iPhone / iPad :</b> ouvrez cette page dans <b>Safari</b>, touchez <b>Partager</b> (le carré avec une flèche vers le haut), puis <b>« Sur l\'écran d\'accueil »</b> et <b>Ajouter</b>.';
    else if (isMacSafari) h = '<b>Mac avec Safari :</b> Safari ne laisse pas un site s\'installer tout seul, il faut le faire une fois à la main. Dans la barre de menus tout en haut de l\'écran, cliquez sur <b>Fichier</b> puis <b>« Ajouter au Dock… »</b>, puis <b>Ajouter</b>. L\'icône apparaît dans le Dock et dans le dossier Applications.<br><small>Si « Ajouter au Dock » n\'apparaît pas, mettez à jour macOS (Sonoma ou plus récent) ou utilisez Google Chrome.</small>';
    else if (/Android/.test(ua)) h = '<b>Android :</b> dans <b>Chrome</b>, touchez le menu <b>⋮</b> en haut à droite, puis <b>« Installer l\'application »</b> (ou « Ajouter à l\'écran d\'accueil »).';
    else if (navigator.brave) h = '<b>Brave :</b> le bouton ne peut pas installer tout seul dans Brave, il faut le faire une fois à la main. Cliquez sur l\'icône <b>Installer</b> (un petit écran avec une flèche) tout à droite dans la barre d\'adresse, puis <b>Installer</b>. Si elle n\'y est pas : menu <b>☰</b> en haut à droite › <b>« Enregistrer et partager »</b> › <b>« Installer la page en tant qu\'application… »</b> (selon la version : <b>« Installer Event Manager… »</b> directement dans le menu). L\'icône apparaît ensuite dans le Dock et le Launchpad.<br><small>Si rien de cela n\'apparaît, désactivez le bouclier Brave (le lion à droite de l\'adresse) pour ce site, rechargez la page et réessayez, ou utilisez Safari (Fichier › « Ajouter au Dock… ») ou Google Chrome.</small>';
    else if (/Macintosh/.test(ua) && /Chrome/.test(ua) && !/Edg|OPR/.test(ua)) h = '<b>Mac avec Google Chrome :</b> cliquez sur l\'icône <b>Installer</b> (un petit écran avec une flèche) tout à droite dans la barre d\'adresse, puis <b>Installer</b>. Sinon : menu <b>⋮</b> en haut à droite › <b>« Caster, enregistrer et partager »</b> › <b>« Installer la page en tant qu\'application… »</b>. L\'icône apparaît dans le Dock et le Launchpad.';
    else if (isFirefox) h = '<b>Firefox</b> ne sait pas installer les applications web sur ordinateur : ouvrez cette page dans <b>Google Chrome</b>, <b>Microsoft Edge</b> ou, sur Mac, <b>Safari</b>.';
    else h = '<b>Ordinateur (Chrome ou Edge) :</b> cliquez sur l\'icône <b>Installer</b> (un petit écran avec une flèche) à droite dans la barre d\'adresse. Sinon : menu <b>⋮</b> › <b>« Enregistrer et partager »</b> (ou « Caster, enregistrer et partager ») › <b>« Installer la page en tant qu\'application… »</b>.';
    if (!isIOS && !isMacSafari && !isFirefox) h += '<br><small>Si le navigateur propose seulement <b>« Ouvrir dans l\'application »</b>, c\'est qu\'elle est <b>déjà installée</b> sur cet appareil : cherchez l\'icône Event Manager dans le Dock, le Launchpad ou l\'écran d\'accueil. Elle s\'est mise à jour toute seule.</small>';
    return h;
  }
  function installLink() { return canInstall() ? ' · <button class="link-btn" data-act="go" data-v="settings">📲 Installer</button>' : ''; }
  function installCard() {
    if (!canInstall()) return '';
    var h = '<div class="card install-card"><div class="install-ic"><img src="' + ($('.brand-logo') || {}).src + '" alt=""></div><div class="install-tx"><h2>Installer l\'application</h2>';
    h += '<p>Event Manager Pro s\'ajoute sur votre écran d\'accueil ou dans le Dock de votre ordinateur, et s\'ouvre comme une vraie application, même sans réseau.</p>';
    if (deferredInstall) h += '<div class="m-actions">' + btn('📲 Installer maintenant', 'install', 'btn-gold btn-lg') + '</div>';
    else h += '<p class="install-how">' + installHelp() + '</p>';
    return h + '</div></div>';
  }
  /* Le bouton reste toujours visible dans le menu : « Installer » dans le navigateur, « ✓ Application installée » dans l'application installée. */
  function paintInstall() {
    var show = canInstall(), inst = isStandalone();
    var sb = $('#side-install');
    if (sb) { sb.hidden = !show && !inst; sb.classList.toggle('is-done', inst); sb.textContent = inst ? '✓ Application installée' : '📲 Installer l\'application'; }
    var tb = $('#top-install'); if (tb) tb.hidden = !show;
  }
  ACT.install = function () {
    if (isStandalone()) { toast('Event Manager Pro est déjà installée : vous l\'utilisez en ce moment comme une application.'); return; }
    if (!deferredInstall) {
      var box = $('#cl-install-help');
      if (CL.el && !CL.el.hidden && box) { box.hidden = !box.hidden; if (!box.hidden && box.scrollIntoView) box.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      openForm('Installer l\'application', [{ type: 'note', k: '_n', html: '<p>' + installHelp() + '</p><p class="small muted mt">Une fois installée, Event Manager Pro s\'ouvre depuis son icône, comme une vraie application.</p>' }], {}, function () {}, { saveLabel: 'Fermer' });
      return;
    }
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function () { deferredInstall = null; render(); }, noop);
  };
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (w) w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) toast('Nouvelle version prête : fermez puis rouvrez l\'application.'); });
        });
      }).catch(noop);
    });
  }

  /* ----- Démarrage ----- */
  function cloudStart() {
    var m = /[?&]invite=([A-Za-z0-9]+)/.exec(location.search);
    if (m) {
      try { sessionStorage.setItem('emp_invite', m[1].toUpperCase()); } catch (e) { CL.invite = m[1].toUpperCase(); }
      try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) { /* rien */ }
    }
    try { CL.invite = CL.invite || sessionStorage.getItem('emp_invite'); } catch (e) { /* rien */ }
    if (!Cloud.configured()) { render(); return; }
    var local = lsGet(KEY + '_mode') === 'local' && !CL.invite, last = lsGet(KEY + '_space');
    if (local) render(); else clShow('<p class="muted cl-wait">Connexion…</p>');
    Cloud.onAuth(function (ev) { if (ev === 'PASSWORD_RECOVERY') clNewPw(); });
    Cloud.init().then(function () {
      if (local) return;
      if (!Cloud.user()) {
        CL.mode = CL.invite ? 'signup' : 'signin'; clAuth();
        loadInvite().then(function () { var b = $('#cl-inv'); if (b) b.outerHTML = inviteBanner(); });
        return;
      }
      afterLogin();
    }).catch(function () {
      if (local) return;
      if (last && lsGet(KEY + '_cloud_' + last)) openSpace(last).catch(noop);
      else { clHide(); render(); toast('Pas de connexion internet : vous travaillez sur cet appareil.'); }
    });
  }

  /* ---------- Branchements ---------- */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    if (el.tagName === 'A') e.preventDefault();
    var fn = ACT[el.getAttribute('data-act')];
    if (fn) fn(el, curEv());
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('#modal').hidden) closeModal();
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card[data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener('change', function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute('data-chg');
    if (!k || !CHG[k]) return;
    var r = CHG[k](el, curEv());
    save(); if (r !== 'norender') render();
  });
  document.addEventListener('input', function (e) {
    if (e.target.getAttribute('data-input') === 'people-filter') {
      var q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('#people-tbl tbody tr').forEach(function (tr) { tr.style.display = !q || tr.getAttribute('data-name').indexOf(q) >= 0 ? '' : 'none'; });
    }
  });
  document.addEventListener('submit', function (e) {
    var f = e.target;
    if (f.id === 'cl-form') { e.preventDefault(); clSubmit(f); return; }
    if (f.id === 'm-form') {
      e.preventDefault();
      if (!formCtx) return;
      var v = readForm(); if (!v) return;
      var cb = formCtx.onSave;
      closeModal();
      if (cb(v) !== false) { save(); render(); }
      return;
    }
    if (f.getAttribute('data-form') === 'add-member') {
      e.preventDefault();
      var ev2 = curEv(), t2 = teamOf(ev2, f.getAttribute('data-team')), nm = f.querySelector('[name=name]');
      if (!nm.value.trim()) { nm.classList.add('is-invalid'); nm.focus(); setTimeout(function () { nm.classList.remove('is-invalid'); }, 1200); return; }
      var np = { id: uid('pm'), name: nm.value.trim(), role: f.querySelector('[name=role]').value.trim(), phone: f.querySelector('[name=phone]').value.trim() };
      t2.people.push(np);
      log(ev2, 'a ajouté ' + np.name + ' à l\'équipe « ' + t2.name + ' ».');
      save(); render(); toast(np.name + ' fait maintenant partie de l\'équipe « ' + t2.name + ' ».');
      var again2 = document.querySelector('form[data-form="add-member"] [name=name]'); if (again2) again2.focus();
      return;
    }
    if (f.getAttribute('data-form') === 'add-contrib') {
      e.preventDefault();
      var ev3 = curEv(), who = f.querySelector('[name=who]'), am = f.querySelector('[name=amount]'), amount = parseFloat(String(am.value).replace(',', '.')) || 0;
      if (!who.value.trim() || amount <= 0) { (who.value.trim() ? am : who).classList.add('is-invalid'); setTimeout(function () { who.classList.remove('is-invalid'); am.classList.remove('is-invalid'); }, 1200); return; }
      ev3.contributions.push({ id: uid('c'), who: who.value.trim(), amount: amount, status: 'recu', note: '', at: new Date().toISOString() });
      log(ev3, 'a noté un don reçu de ' + who.value.trim() + ' (' + fmtMoney(amount) + ').');
      save(); render(); toast('Don de ' + fmtMoney(amount) + ' noté. Merci !');
      var again3 = document.querySelector('form[data-form="add-contrib"] [name=who]'); if (again3) again3.focus();
      return;
    }
    if (f.getAttribute('data-form') === 'add-sub') {
      e.preventDefault();
      var ev = curEv(), m = findM(ev, f), inp = f.querySelector('input'), title = inp.value.trim();
      if (!title) { inp.classList.add('is-invalid'); setTimeout(function () { inp.classList.remove('is-invalid'); }, 1200); return; }
      m.subtasks.push({ id: uid('s'), title: title, done: false, who: '', due: '' });
      if (m.done) m.done = false;
      log(ev, 'a ajouté la tâche « ' + title + ' » (' + m.title + ').');
      resetOk(ev, m.teamId, 'nouvelle tâche ajoutée');
      save(); render();
      var again = document.querySelector('form[data-m="' + m.id + '"] input'); if (again) again.focus();
    }
  });
  function setRole(v) {
    var p = v.split(':');
    if (ON.on && (v === 'org' || ON.tr[p[1]] !== p[0])) return render();
    state.role = v === 'org' ? { kind: 'org' } : { kind: p[0], catId: p[1] };
    ui.view = v === 'org' ? (ui.evOpen ? 'dash' : 'home') : 'myteam'; if (v !== 'org') ui.evOpen = true;
    if (ON.on) lsSet(KEY + '_team_' + ON.space.id, v);
    save(); closeSide(); render(); window.scrollTo(0, 0);
    var c = v === 'org' ? null : catOf(p[1]), t = c && teamByCat(curEv(), c.id);
    if (ON.on) return toast('Équipe « ' + (c ? c.name : '') + ' » : vous y êtes ' + (p[0] === 'lead' ? 'chef (budget, dépenses, missions).' : 'membre (vos tâches, sans les montants).'));
    toast(!c ? 'Vous êtes l\'organisateur général.' : p[0] === 'lead' ? 'Vous voyez l\'application comme ' + ((t || c).lead || 'le chef') + ', chef de « ' + c.name + ' ».' : 'Vous voyez l\'application comme un membre de « ' + c.name + ' ».');
  }
  $('#role-sel').addEventListener('change', function (e) {
    var v = e.target.value;
    if (v === 'org' && !isOrg() && state.orgPin) {
      e.target.value = state.role.kind + ':' + state.role.catId;
      openForm('Code organisateur', [{ k: 'pin', label: 'Entrez le code organisateur', type: 'password', req: true }], {}, function (f) {
        if (f.pin !== state.orgPin) { toast('Code incorrect.'); return false; }
        setRole('org');
      }, { saveLabel: 'Entrer' });
      return;
    }
    setRole(v);
  });
  $('#ev-sel').addEventListener('change', function (e) {
    ui.liveDay = null;
    if (!e.target.value) { save(); go('home'); return; }
    state.eventId = e.target.value; ui.evOpen = true; save(); go(isOrg() ? 'dash' : 'myteam');
  });
  $('#import-file').addEventListener('change', function (e) {
    var file = e.target.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var s = JSON.parse(rd.result);
        if (!s || s.v !== 2 || !Array.isArray(s.events)) throw new Error('format');
        migrate(s);
        if (!confirm('Remplacer les données de cet appareil par celles du fichier « ' + file.name + ' » ?')) return;
        state = s; ui.view = null; save(); render(); toast('Sauvegarde importée.');
      } catch (err) { toast('Ce fichier n\'est pas une sauvegarde Event Manager Pro.'); }
      e.target.value = '';
    };
    rd.readAsText(file);
  });
  var toastT;
  function toast(msg) { var t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 3200); }

  // Le jour J, l'écran en direct se met à jour chaque minute.
  setInterval(function () { if (ui.view === 'live' && $('#modal').hidden && !document.activeElement.matches('input,textarea,select')) render(); }, 60000);

  cloudStart();
  window.EMP = { state: function () { return state; }, version: APP_VERSION, cloud: ON, save: function () { save(); render(); }, decompose: function () { return decompose(state); } };
})();
</script>
</body>
</html>
