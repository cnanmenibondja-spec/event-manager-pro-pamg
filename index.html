<style>:root{
  --gold:#E8B52C; --gold-light:#F7D46A; --gold-ink:#94690A; --gold-soft:#FDF5DD;
  --navy:#0A1230; --navy-2:#141E46; --black:#05070F;
  --bg:#F5F6FA; --card:#FFFFFF; --ink:#0A1230; --ink-2:#3A4365; --muted:#6B7391;
  --line:#E3E6EF; --line-2:#CDD2E0;
  --green:#178A5C; --green-soft:#E3F5EC; --red:#C93C3C; --red-soft:#FCE9E9; --amber:#B86E00; --amber-soft:#FFF1DA; --blue-soft:#E8EEFB;
  --r-lg:18px; --r:12px; --r-sm:8px; --side:256px;
  --f-title:'Playfair Display',Georgia,serif; --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(10,18,48,.05),0 6px 20px rgba(10,18,48,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-title);margin:0;color:var(--ink);font-weight:700;letter-spacing:-.005em}
h1{font-size:28px;line-height:1.15} h2{font-size:19px} h3{font-size:16.5px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px} .sp{flex:1}
.app{display:flex;min-height:100vh}

/* --- Barre latérale --- */
.side{width:var(--side);position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,var(--navy) 0%,#070C22 60%,var(--black) 100%);color:#fff;display:flex;flex-direction:column;z-index:50;overflow-y:auto;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 16px}
.brand-logo{width:48px;height:48px;object-fit:contain;flex-shrink:0}
.brand-txt{display:flex;flex-direction:column;min-width:0}
.brand-txt b{font-family:var(--f-title);font-size:17px;font-weight:700;line-height:1.1}
.brand-txt span{font-size:9.5px;letter-spacing:.32em;color:var(--gold);font-weight:700;margin-top:3px}
.brand-txt small{font-size:11px;color:rgba(255,255,255,.62);margin-top:4px;line-height:1.25}
.side-pick{padding:4px 16px 8px}
.side-pick label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.55);margin:0 0 4px 4px;font-weight:600}
.side-pick select{width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:10px;padding:9px 10px;font-size:13.5px}
.side-pick select option{color:var(--ink)}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav-sep{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.4);padding:12px 12px 4px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:none;border:0;cursor:pointer;color:rgba(255,255,255,.78);font-size:14px;font-weight:500;text-align:left;width:100%}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.is-active{background:#fff;color:var(--navy);font-weight:600}
.nav-item.is-active svg{color:var(--gold-ink);opacity:1}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
.side-foot{padding:14px 20px 22px;font-size:11.5px;color:rgba(255,255,255,.5);border-top:1px solid rgba(255,255,255,.08)}
.scrim{display:none}

/* --- Zone principale --- */
.main{flex:1;margin-left:var(--side);min-width:0}
.top{display:none}
.view{max-width:1180px;margin:0 auto;padding:30px 32px 80px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vhead p{color:var(--muted);margin-top:6px}
.vhead .acts{display:flex;gap:8px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:8px;font-size:13.5px}
.back:hover{color:var(--ink)}

/* --- Boutons, puces --- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;border:1px solid var(--line-2);background:#fff;color:var(--ink);padding:9px 15px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-2)}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-primary:hover{background:var(--navy-2)}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-light)}
.btn-ok{background:var(--green);border-color:var(--green);color:#fff}
.btn-danger{color:var(--red);border-color:#EBC4C4}
.btn-alert{background:var(--red);border-color:var(--red);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn-lg{padding:13px 20px;font-size:15.5px;border-radius:12px}
.icon-btn{background:none;border:0;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px 7px;border-radius:8px}
.icon-btn:hover{background:var(--bg);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--bg);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.bad{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.gold{background:var(--gold-soft);color:var(--gold-ink);border-color:transparent}
.chip.navy{background:var(--navy);color:#fff;border-color:transparent}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex-shrink:0}

/* --- Cartes --- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:20px}
.card h2{margin-bottom:14px;display:flex;align-items:center;gap:10px}
.card h2 .acts{margin-left:auto}
.grid{display:grid;gap:18px}
.grid>*,.kpis>*{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.mt{margin-top:18px}
.empty{color:var(--muted);text-align:center;padding:26px 12px;border:1.5px dashed var(--line-2);border-radius:var(--r);font-size:14px}

/* --- Bandeau événement --- */
.hero{background:linear-gradient(135deg,var(--navy) 0%,#111C4A 55%,#0B0F22 100%);color:#fff;border-radius:22px;padding:26px 28px;display:flex;align-items:center;gap:24px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(232,181,44,.22),transparent 70%)}
.hero h1{color:#fff;font-size:27px}
.hero .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero p{color:rgba(255,255,255,.75);margin-top:6px}
.hero-l{flex:1;min-width:0;position:relative;z-index:1}
.hero-meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hero-meta span{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;font-size:13px}
.hero-meta span b{color:var(--gold-light)}
.ring{position:relative;width:128px;height:128px;flex-shrink:0;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-txt b{font-family:var(--f-title);font-size:30px;line-height:1}
.ring .ring-txt small{font-size:11px;opacity:.75;margin-top:3px}
.ring.dark .ring-txt b{color:var(--ink)}
.ring.dark .ring-txt small{color:var(--muted)}

.banner{border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;font-weight:600;margin-top:16px}
.banner.ok{background:var(--green-soft);color:#0F6B46}
.banner.warn{background:var(--amber-soft);color:#8A5200}
.banner.wait{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.banner.bad{background:var(--red-soft);color:#9B2626}
.banner .big{font-size:22px}
.banner .acts{margin-left:auto}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi b{display:block;font-family:var(--f-title);font-size:25px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.gold{border-color:var(--gold);background:var(--gold-soft)}

/* --- Barres de progression --- */
.bar{height:8px;background:#EDEFF5;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:999px;transition:width .3s}
.bar.full i{background:var(--green)}
.bar.low i{background:#E9A23B}
.bar.over i{background:var(--red)}
.tbl a{color:var(--ink);text-decoration:none;font-weight:600}
.tbl a:hover{text-decoration:underline}

/* --- Équipes --- */
.trow{display:flex;align-items:center;gap:12px;padding:11px 8px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--bg)}
.trow-main{flex:1;min-width:0}
.trow-main b{display:block;font-size:14.5px}
.trow-main small{color:var(--muted);font-size:12.5px;display:block;margin-bottom:6px}
.pct{font-weight:700;font-size:14px;width:46px;text-align:right}
.team-card{border-top:4px solid var(--gold);cursor:pointer;display:flex;flex-direction:column;gap:10px}
.team-card .tc-top{display:flex;align-items:flex-start;gap:10px}
.team-card .tc-top h3{flex:1}
.team-card .tc-meta{font-size:13px;color:var(--ink-2)}
.team-card .tc-foot{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

/* --- Missions --- */
.mission{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.mission.is-done{border-color:#BFE3D0}
.m-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px}
.m-head>div:first-child{flex:1;min-width:0}
.m-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.m-pct{font-family:var(--f-title);font-size:22px;font-weight:700}
.m-tools{display:flex;align-items:center;gap:4px;margin-left:4px}
.sub-tools{display:flex;gap:2px}
.icon-btn.danger:hover{background:var(--red-soft);color:var(--red)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 12px;flex-wrap:wrap}
.sec-head h2{display:flex;align-items:center;gap:8px}
.m-desc{margin-top:12px;color:var(--ink-2);font-size:14px;white-space:pre-line;background:var(--bg);border-radius:10px;padding:10px 12px}
.subs{list-style:none;padding:0;margin:12px 0 0}
.subs li{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.subs li label{flex:1;display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:14.5px}
.subs li.done{background:var(--green-soft);border-radius:8px;border-bottom-color:#fff}
.subs li.done label span{color:var(--green);font-weight:600}
.subs li small{font-size:12px;color:var(--muted);white-space:nowrap}
.subs li small.late{color:var(--red);font-weight:600}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--green);flex-shrink:0;margin:1px 0 0;cursor:pointer}
.m-solo{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink-2);cursor:pointer}
.add-sub{display:flex;gap:8px;margin-top:10px}
.add-sub input{flex:1;border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;min-width:0}
.qa{margin-top:12px;border-left:3px solid var(--gold);background:var(--gold-soft);border-radius:0 10px 10px 0;padding:10px 12px;font-size:14px}
.qa .q b,.qa .a b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-ink);display:block}
.qa .a{margin-top:8px}
.qa .a.none{color:var(--amber);font-weight:600}
.m-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.mrow{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:hover{background:var(--bg)}
.mrow .mr-main{flex:1;min-width:0}
.mrow .mr-main b{display:block;font-size:14.5px}
.mrow .mr-main small{font-size:12.5px;color:var(--muted)}
.mrow .bar{width:110px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.filters button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.filters button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.okbox{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.okbox .okinfo{flex:1;min-width:220px}

/* --- Alertes, fil --- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}
.alert:last-child{border-bottom:0}
.alert .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff}
.alert.bad .ic{background:var(--red)} .alert.warn .ic{background:#E09B1A} .alert.info .ic{background:#7B87AD}
.feed{list-style:none;margin:0;padding:0}
.feed li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed li:last-child{border-bottom:0}
.feed li small{display:block;color:var(--muted);font-size:12px}

/* --- Tableaux --- */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 8px;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tfoot td{font-weight:700;border-top:1px solid var(--line-2)}
.searchbox{border:1px solid var(--line-2);border-radius:10px;padding:9px 12px;width:100%;max-width:340px;background:#fff}

/* --- Programme --- */
.day h2{font-size:18px;margin:22px 0 10px;text-transform:capitalize}
.prog{list-style:none;margin:0;padding:0}
.prog li{display:flex;gap:14px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line);background:#fff}
.prog li:first-child{border-radius:12px 12px 0 0} .prog li:last-child{border-radius:0 0 12px 12px;border-bottom:0}
.prog .tm{font-weight:700;font-variant-numeric:tabular-nums;width:110px;flex-shrink:0;font-size:14px}
.prog .tm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.prog .pt{flex:1;min-width:0}
.prog .pt small{display:block;color:var(--muted);font-size:12.5px}
.prog li.now{background:var(--gold-soft);box-shadow:inset 4px 0 0 var(--gold)}
.prog li.past{opacity:.6}
.prog li.done .pt b{color:var(--green)}
.prog-box{border:1px solid var(--line);border-radius:12px;overflow:hidden}

/* --- Jour J --- */
.live-top{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:14px}
.now-card{background:var(--navy);color:#fff;border-radius:var(--r-lg);padding:18px 20px}
.now-card .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.now-card h3{color:#fff;font-size:20px;margin-top:6px}
.now-card p{color:rgba(255,255,255,.7);font-size:13.5px;margin-top:4px}
.next-card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px}
.next-card .lbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700}
.next-card h3{margin-top:6px}
.next-card p{color:var(--muted);font-size:13.5px;margin-top:4px}
.clock{font-family:var(--f-title);font-size:40px;font-weight:700;line-height:1}
.sim{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--blue-soft);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:16px}
.sim select,.sim input{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:#fff}
.inc{border:1px solid var(--line);border-left:5px solid #7B87AD;border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.inc.critique{border-left-color:var(--red)} .inc.moyen{border-left-color:#E09B1A} .inc.faible{border-left-color:#7B87AD}
.inc.resolu{opacity:.65;border-left-color:var(--green)}
.inc-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inc-h b{flex:1;min-width:150px;font-size:15px}
.inc p{font-size:13.5px;color:var(--ink-2);margin-top:6px}
.inc .fix{background:var(--green-soft);color:#0F6B46;border-radius:8px;padding:7px 10px;margin-top:8px;font-size:13.5px}
.inc .fix.none{background:var(--amber-soft);color:#8A5200}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.quick button:hover{border-color:var(--red);color:var(--red)}
.checkins{display:flex;flex-wrap:wrap;gap:8px}
.checkins button{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:600}
.checkins button.on{background:var(--green-soft);border-color:#9FD4B9;color:#0F6B46}

/* --- Liste d'événements --- */
.ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ev-card{cursor:pointer;display:flex;flex-direction:column;gap:10px}
.ev-card.is-cur{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft),var(--shadow)}
.ev-card .ev-top{display:flex;gap:6px;align-items:center}
.ev-card .ev-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* --- Tableau de bord : liste compacte --- */
.evlist{display:flex;flex-direction:column}
.evrow{display:flex;align-items:center;gap:14px;padding:12px 10px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:10px}
.evrow:last-child{border-bottom:0}
.evrow:hover{background:var(--bg)}
.evdate{width:54px;flex-shrink:0;text-align:center;background:var(--navy);color:#fff;border-radius:10px;padding:6px 0}
.evdate b{display:block;font-family:var(--f-title);font-size:20px;line-height:1.1}
.evdate span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-light)}
.evmain{flex:1;min-width:0}
.evmain b{display:block;font-size:15px}
.evmain small{color:var(--muted);font-size:12.5px}
.evprog{width:150px;flex-shrink:0}
.evprog small{font-size:12px;color:var(--muted)}
.evgo{font-size:24px;color:var(--line-2);margin-left:2px}
.new-ev-empty{text-align:center;padding:36px 20px}

/* --- Membres d'équipe --- */
.members{list-style:none;margin:0;padding:0}
.members li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.members li:last-child{border-bottom:0}
.members li.is-lead{background:var(--gold-soft);border-radius:12px;padding:10px;border-bottom:0;margin-bottom:4px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.pmain{flex:1;min-width:0}
.pmain b{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14.5px}
.pmain small{color:var(--muted);font-size:12.5px}
.add-member{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.add-member input{flex:1;min-width:140px;border:1px solid var(--line-2);border-radius:9px;padding:8px 11px}

/* --- Documents d'équipe --- */
.files{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.files li:last-child{border-bottom:0}
.files .fic{width:40px;height:40px;border-radius:10px;background:var(--gold-soft);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;text-transform:uppercase}
.files .fmain{flex:1;min-width:0}
.files .fmain b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.files .fmain small{color:var(--muted);font-size:12.5px}
.upload{display:inline-flex}
.upload input{display:none}

/* --- Formulaires --- */
.modal{position:fixed;inset:0;background:rgba(5,7,15,.55);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal[hidden]{display:none}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
#m-form{padding:8px 22px 20px;display:flex;flex-wrap:wrap;gap:0 14px}
.f-row{width:100%;margin-bottom:12px}
.f-row.half{width:calc(50% - 7px)}
.f-row label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--ink-2)}
.f-row input,.f-row select,.f-row textarea{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:#fff;font-size:14.5px}
.f-row textarea{resize:vertical}
.f-row small{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.f-row .is-invalid,.is-invalid{border-color:var(--red)!important;box-shadow:0 0 0 3px var(--red-soft)}
.f-check{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:12px;font-size:14px;cursor:pointer}
.f-note{width:100%;background:var(--gold-soft);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;color:var(--ink-2)}
.m-actions-row{display:flex;gap:8px;width:100%;margin-top:6px;flex-wrap:wrap}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors label{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid #fff;box-shadow:0 0 0 1px var(--line-2)}
.colors input{display:none}
.colors input:checked+label{box-shadow:0 0 0 2px var(--navy)}
.info-box{background:var(--blue-soft);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--ink-2)}
.info-box b{color:var(--ink)}
.info-box ul{margin:8px 0 0;padding-left:20px}
.tip{background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
textarea.big{width:100%;min-height:110px;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;resize:vertical}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:200;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%)}

/* --- Téléphone / tablette --- */
@media (max-width:1000px){
  .g3{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .live-top{grid-template-columns:1fr 1fr}
  .live-top>:first-child{grid-column:1/-1}
}
@media (max-width:820px){
  .side{transform:translateX(-100%);box-shadow:none}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  .scrim.on{display:block;position:fixed;inset:0;background:rgba(5,7,15,.45);z-index:45}
  .main{margin-left:0}
  .top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top))}
  .burger{background:none;border:0;color:#fff;padding:4px;cursor:pointer;display:flex}
  .top-logo{width:32px;height:32px;object-fit:contain}
  .top-title{font-family:var(--f-title);font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .role-chip{font-size:11.5px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 10px;white-space:nowrap;max-width:42vw;overflow:hidden;text-overflow:ellipsis}
  .view{padding:18px 16px 70px}
  h1{font-size:23px}
  .g2,.g3{grid-template-columns:1fr}
  .hero{flex-direction:column;align-items:flex-start;padding:22px 20px}
  .hero h1{font-size:22px}
  .ring{width:104px;height:104px;align-self:center}
  .live-top{grid-template-columns:1fr}
  .mrow .bar{width:60px}
  .f-row.half{width:100%}
  .prog .tm{width:84px}
  .modal{padding:12px 8px}
  .vhead .acts{width:100%}
  .banner{flex-wrap:wrap}
  .banner .acts{margin-left:0}
  .trow{flex-wrap:wrap}
  .trow .trow-main{flex-basis:calc(100% - 80px)}
  .trow .chip{margin-left:23px}
  .prog li{flex-wrap:wrap;gap:6px 12px}
  .prog .pt{flex-basis:calc(100% - 110px)}
  .mrow{flex-wrap:wrap}
  .mrow .mr-main{flex-basis:100%}
  .evrow{flex-wrap:wrap;gap:8px 12px}
  .evmain{flex-basis:calc(100% - 70px)}
  .evprog{width:auto;flex:1;min-width:120px}
  .evgo{display:none}
  .files li{flex-wrap:wrap}
  .members li{flex-wrap:wrap}
  .m-head{flex-wrap:wrap}
  .m-head>div:first-child{flex-basis:calc(100% - 70px)}
  .m-tools{margin-left:auto}
  .members .pmain{flex-basis:calc(100% - 96px)}
  .add-member input{flex-basis:100%}
  .card h2{flex-wrap:wrap}
}
/* ---------- v3.0 ---------- */
.mring{position:relative;width:40px;height:40px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center}
.mring svg{position:absolute;inset:0;width:100%;height:100%}
.mring b{position:relative;font-size:11px;font-weight:700;color:var(--ink)}
.mring.full b{color:var(--green)}
.okbox .mring{width:52px;height:52px}
.okbox .mring b{font-size:13px}
.btn-off{background:#EEF0F4;border-color:#E2E5EC;color:#9AA1B2;cursor:not-allowed}
.btn-reserve{background:#E07B39;border-color:#E07B39;color:#fff}
.btn-reserve:hover{background:#C9682A}
.res-items{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px}
.res-items li{background:var(--amber-soft);border-left:3px solid #E07B39;border-radius:8px;padding:9px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.res-items em{font-style:normal;color:var(--amber);font-weight:600}
.res-title{font-weight:700;color:var(--ink);background:var(--amber-soft);border-radius:8px;padding:7px 10px;margin-top:6px}
.hero-acts{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.ev-edit{font-size:17px}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.checks .f-check{margin:0;padding:4px 0}
.checks .dot{margin-right:2px}
.kpis.mini{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:4px 0 10px}
.kpis.mini .kpi{padding:10px 12px}
.kpis.mini .kpi b{font-size:19px}
.sub-h{font-size:15px;margin:16px 0 8px}
.fin-card.is-fin{border-color:var(--green);box-shadow:0 0 0 2px var(--green-soft)}
.fin-tbl tbody tr{cursor:pointer}
.fin-tbl tbody tr:hover td{background:var(--bg)}
.fin-tbl tr.fin-ok td{background:var(--green-soft)}
.fin-tbl tr.fin-ok td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.fin-tbl tr.fin-detail td{background:#FAFBFD;cursor:default}
.fin-det{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:4px 2px}
.fin-det h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.fin-det ul{margin:0 0 8px;padding-left:18px;font-size:13.5px;display:grid;gap:3px}
.pot{border-top:4px solid var(--gold)}
.pot-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pot-main{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.pot-main p{margin:0}
.pot-main .big-num{font-family:var(--f-title);font-size:24px}
.pot-head{margin-bottom:10px}
.pot-head .bar{margin:6px 0}
.quick-contrib{margin-top:12px}
.m-actions .muted.small{align-self:center}
.chip-edit{cursor:pointer;font:inherit;font-size:12px}
.chip-edit .pen{font-style:normal;margin-left:6px;opacity:.75}
.chip-edit:hover{filter:brightness(.95);box-shadow:0 0 0 2px #FBEFC8}
.pen-btn{font-size:15px;padding:2px 6px;color:var(--navy)}
.money-tbl td{vertical-align:middle}
.money-tbl td.num .btn{margin-left:6px}
.sec-title{font-size:18px;margin:22px 0 10px}
.meeting{border-left:4px solid var(--gold)}
.meeting.is-past{border-left-color:var(--line-2);opacity:.92}
.agenda{margin:6px 0 0;padding-left:20px;display:grid;gap:2px}
.rsvp-me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0 4px;padding:10px 12px;background:var(--bg);border-radius:10px}
.rsvp-me span{font-weight:600;margin-right:4px}
.rsvp-sum{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:none;border:0;padding:8px 0;cursor:pointer;font:inherit}
.rsvp-list .rs{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:#fff;cursor:pointer;font-weight:700;color:var(--muted)}
.rsvp-list .rs.on-yes{background:var(--green);border-color:var(--green);color:#fff}
.rsvp-list .rs.on-no{background:var(--red);border-color:var(--red);color:#fff}
.mt-strip .evrow{padding:9px 8px}
@media (max-width:820px){
  .checks,.fin-det{grid-template-columns:1fr}
  .kpis.mini{grid-template-columns:repeat(2,minmax(0,1fr))}
  .trow .mring{margin-left:auto}
  .okbox .okinfo{min-width:0;flex-basis:calc(100% - 70px)}
}
@media print{
  .side,.top,.vhead .acts,.m-actions,.add-sub,.btn,.icon-btn,.quick,.filters{display:none!important}
  .main{margin:0}.view{padding:0;max-width:none}
  .card,.mission{box-shadow:none;break-inside:avoid}
  body{background:#fff}
}

/* --- v4.0 En ligne : connexion, espaces, invitations --- */
.cloud{position:fixed;inset:0;z-index:200;background:radial-gradient(120% 80% at 50% 0%,var(--navy-2) 0%,var(--navy) 45%,var(--black) 100%);display:flex;align-items:flex-start;justify-content:center;padding:48px 16px;overflow-y:auto}
.cloud[hidden]{display:none}
body.cl-open{overflow:hidden}
.cl-box{width:100%;max-width:440px;background:var(--card);border-radius:var(--r-lg);box-shadow:0 20px 60px rgba(0,0,0,.35);padding:28px 26px 24px;display:flex;flex-direction:column;gap:14px}
.cl-brand{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.cl-brand img{width:56px;height:56px;object-fit:contain}
.cl-brand b{font-family:var(--f-title);font-size:21px;display:block;line-height:1.1}
.cl-brand b span{color:var(--gold-ink)}
.cl-brand small{color:var(--muted);font-size:12.5px}
.cl-h{font-size:19px}
.cl-wait{text-align:center;padding:20px 0}
.cl-inv{background:var(--gold-soft);border:1px solid #F1DFA6;border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.5}
.cl-inv.bad{background:var(--red-soft);border-color:#F3C6C6;color:#8E2424}
.cl-tabs{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.cl-tabs button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.cl-tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.cl-form{display:flex;flex-direction:column;gap:12px}
.cl-form label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.cl-form label small{font-weight:400;color:var(--muted)}
.cl-form input:not([type=radio]){border:1px solid var(--line-2);border-radius:10px;padding:11px 12px;font-size:16px;background:#fff;width:100%}
.cl-form input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--gold-soft)}
.cl-form .cl-radio{flex-direction:row;align-items:flex-start;gap:8px;font-weight:500}
.cl-form .cl-radio input{margin-top:3px}
.cl-form .btn{justify-content:center}
.cl-err{color:var(--red);font-size:13.5px;min-height:1px;margin:0}
.cl-err:empty{display:none}
.cl-sep{height:1px;background:var(--line);margin:2px 0}
.cl-local{justify-content:center;color:var(--muted);font-size:13.5px}
.cl-forgot{align-self:center}
.cl-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.cl-hello{font-size:16px}
.cl-lab{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin-bottom:6px}
.cl-list{display:flex;flex-direction:column;gap:8px}
.cl-space{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:12px 14px;cursor:pointer}
.cl-space:hover{border-color:var(--gold)}
.cl-space b{font-size:15.5px}
.cl-space small{grid-column:1;color:var(--muted);font-size:12.5px}
.cl-space span{grid-column:2;grid-row:1/3;color:var(--gold-ink);font-weight:700;font-size:14px}
.cl-empty{background:var(--blue-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.55}
.cl-new{border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.cl-new summary{cursor:pointer;font-weight:600;font-size:14px;padding:2px 0}
.cl-new[open] summary{margin-bottom:12px}
.link-btn{background:none;border:0;padding:0;color:var(--gold-ink);text-decoration:underline;cursor:pointer;font-size:inherit}
.side-foot .link-btn{color:var(--gold)}
.cl-foot{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.85);font-weight:600;margin-bottom:2px}
.cl-foot-sp{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.cl-dot.on{background:#3DDC97}
.cl-dot.off{background:#F5A524}
.cl-dot.sync{background:var(--gold);animation:clp 1s ease-in-out infinite alternate}
@keyframes clp{from{opacity:.35}to{opacity:1}}
.side-pick select:disabled{opacity:1;cursor:default;-webkit-appearance:none;appearance:none}
.cl-link{width:100%;border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:14px;margin:10px 0;background:var(--bg)}
.cl-mem select{border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:#fff;max-width:170px}
.cl-invrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:520px){.cloud{padding:20px 12px}.cl-box{padding:22px 18px}}

/* --- v4.1 Installer l'application --- */
.install-card{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px;border:1px solid #F1DFA6;background:linear-gradient(135deg,#fff 0%,var(--gold-soft) 100%)}
.install-ic img{width:56px;height:56px;object-fit:contain}
.install-tx{flex:1;min-width:0}
.install-tx p{margin-top:6px;line-height:1.55}
.cl-install{justify-content:center}
.cl-install[hidden]{display:none}
@media (max-width:520px){.install-card{flex-direction:column;gap:8px}}

/* --- v4.2 Bouton « Installer » toujours visible --- */
.side-install{margin:4px 16px 6px;padding:10px 12px;border-radius:10px;border:0;background:var(--gold);color:var(--navy);font-weight:700;font-size:14px;cursor:pointer;text-align:center}
.side-install:hover{background:var(--gold-light)}
.side-install[hidden],.top-install[hidden]{display:none}
.top-install{display:none}
@media (max-width:820px){.top-install{display:inline-flex;align-items:center;margin-left:auto;border:0;border-radius:999px;background:var(--gold);color:var(--navy);font-weight:700;font-size:12px;padding:5px 10px;cursor:pointer;white-space:nowrap}.top-install+.role-chip{margin-left:0}}
.install-how{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;line-height:1.6}
.install-how small{color:var(--muted)}
.cl-install-help{font-size:13.5px}

/* v4.4 : plusieurs équipes par personne */
.cl-teams{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cl-team{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);border-radius:999px;padding:3px 4px 3px 4px;background:var(--bg);font-size:13px}
.cl-team.lead{border-color:var(--gold,#C9A227)}
.cl-mem .cl-team select{padding:2px 4px;border-radius:999px;font-size:12px;max-width:none}
.cl-tx{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:13px;padding:2px 6px;border-radius:999px}
.cl-tx:hover{background:var(--line)}
.cl-mem select.cl-tadd{font-size:12px;color:var(--ink-2)}
/* v4.5 : application déjà installée */
.side-install.is-done{background:transparent;color:var(--gold-light);border:1px solid rgba(232,181,44,.45);font-weight:600}
.side-install.is-done:hover{background:rgba(232,181,44,.12)}
.cl-installed{text-align:center;font-size:13px;color:var(--ok,#1f8a4c);margin-top:12px}
/* v5.0 : mes événements, répartition des rôles, prévenir l'équipe */
body.cl-open .modal{z-index:250}
.toast{z-index:300}
.cl-newev{width:100%;justify-content:center;margin-top:10px}
.cl-import{width:100%;justify-content:center;margin-top:8px}
.ev-cards{display:flex;flex-direction:column;gap:8px}
.ev-card{display:flex;align-items:center;gap:12px;text-align:left}
.ev-card.past{opacity:.7}
.ev-card .evdate{min-width:44px}
.ev-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ev-main small{white-space:normal}
.ev-cnt{color:var(--ink-2);font-size:12px;margin-top:2px}
.ev-inv{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-left:4px solid var(--gold);margin-bottom:10px}
.ev-inv p{margin:4px 0 0}
.ev-inv.in-ev{margin-bottom:16px}
.ev-inv.no{border-left-color:var(--bad,#C93C3C)}
.ev-news{margin-bottom:10px;border-left:4px solid var(--ok,#1f8a4c)}
.ev-news p{margin:4px 0}
.ev-phone{margin-bottom:10px}
.ev-phone-row{display:flex;gap:8px;margin-top:8px}
.ev-phone-row input{flex:1;min-width:0;border:1px solid var(--line-2);border-radius:8px;padding:8px 10px}
.ev-list .ev-card,.ev-list .card{color:var(--ink)}
.roles-pub{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-left:4px solid var(--gold)}
.roles-pub.ok{border-left-color:var(--ok,#1f8a4c);display:block}
.roles-pub p{margin:4px 0 0}
.roles-team{border-top:4px solid var(--line)}
.roles-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}
.roles-row b{flex:1;min-width:120px}
.roles-row select,.roles-add{border:1px solid var(--line-2);border-radius:8px;padding:5px 8px;background:#fff}
.roles-add{margin-top:10px;width:100%}
.notify-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.notify-grp{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px;font:inherit;font-size:13px}
</style>
</head>

   Comptes (e-mail + mot de passe), espaces, invitations, éléments synchronisés et fichiers.
   Sans configuration (window.EMP_CLOUD vide), l'application reste 100 % sur l'appareil. */
(function () {
  'use strict';
  var CFG = window.EMP_CLOUD || {};
  var LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
  var BUCKET = 'emp-files';
  var sb = null, user = null, spaceId = null, channel = null, authCb = null;

  function loadLib() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve();
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = LIB; s.async = true;
      s.onload = function () { res(); };
      s.onerror = function () { rej(new Error('Connexion impossible (hors ligne ?)')); };
      document.head.appendChild(s);
    });
  }
  function must(r) { if (r.error) throw r.error; return r.data; }
  function frErr(e) {
    var m = String((e && (e.message || e.error_description)) || e || '');
    if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
    if (/already registered|already exists/i.test(m)) return 'Un compte existe déjà avec cet e-mail : choisissez « J\'ai déjà un compte ».';
    if (/Password should be at least/i.test(m)) return 'Le mot de passe doit avoir au moins 6 caractères.';
    if (/Email not confirmed/i.test(m)) return 'L\'e-mail n\'est pas encore confirmé (réglage Supabase « Confirm email » à désactiver).';
    if (/invalid format|valid email|Unable to validate email/i.test(m)) return 'Cette adresse e-mail n\'est pas valide.';
    if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Pas de connexion internet.';
    if (/does not exist|schema cache|Could not find the (table|function|column)/i.test(m)) return 'La base de données n\'est pas encore à jour : lancez une fois le script SQL v5.0 dans Supabase (SQL Editor), puis rechargez la page.';
    if (/rate limit/i.test(m)) return 'Trop d\'essais : attendez quelques minutes.';
    return m || 'Erreur inconnue';
  }
  function isNetErr(e) { return /Failed to fetch|NetworkError|network|Load failed|timeout/i.test(String((e && e.message) || e || '')); }

  var Cloud = {
    configured: function () { return !!(CFG.url && CFG.key); },
    ready: function () { return !!sb; },
    user: function () { return user; },
    spaceId: function () { return spaceId; },
    frErr: frErr, isNetErr: isNetErr,
    onAuth: function (cb) { authCb = cb; },

    init: function () {
      if (!Cloud.configured()) return Promise.resolve(false);
      return loadLib().then(function () {
        // Chaque édition garde sa propre connexion (les deux sites partagent la même adresse github.io).
        var AK = 'emp_auth_' + String((window.BRAND && window.BRAND.id) || 'x').toLowerCase();
        try { if (!localStorage.getItem(AK) && localStorage.getItem('emp_auth')) localStorage.setItem(AK, localStorage.getItem('emp_auth')); } catch (e) { /* bloqué */ }
        sb = window.supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: AK } });
        sb.auth.onAuthStateChange(function (ev, session) { user = session ? session.user : null; if (authCb) authCb(ev, user); });
        return sb.auth.getSession();
      }).then(function (r) { user = r.data && r.data.session ? r.data.session.user : null; return true; });
    },

    /* ----- Comptes ----- */
    signUp: function (email, pw, name, phone) {
      return sb.auth.signUp({ email: email, password: pw, options: { data: { name: name || '', phone: phone || '' } } }).then(function (r) {
        if (r.error) throw r.error;
        if (!r.data.session) throw new Error('Email not confirmed');
        user = r.data.user; return user;
      });
    },
    signIn: function (email, pw) { return sb.auth.signInWithPassword({ email: email, password: pw }).then(function (r) { if (r.error) throw r.error; user = r.data.user; return user; }); },
    signOut: function () { Cloud.unsubscribe(); spaceId = null; return sb.auth.signOut().then(function () { user = null; }); },
    resetPassword: function (email) { return sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }).then(must); },
    setPassword: function (pw) { return sb.auth.updateUser({ password: pw }).then(must); },
    displayName: function () { return user ? ((user.user_metadata && user.user_metadata.name) || user.email.split('@')[0]) : ''; },

    /* ----- Annuaire (v5.0) : nom et WhatsApp de chaque inscrit de l'édition ----- */
    myProfile: function (edition) { return sb.from('profiles').select('user_id, name, phone').eq('user_id', user.id).eq('edition', edition).then(must).then(function (r) { return r[0] || null; }); },
    saveProfile: function (edition, name, phone) { return sb.from('profiles').upsert({ user_id: user.id, edition: edition, name: name || '', phone: phone || '' }, { onConflict: 'user_id,edition' }).then(must); },
    directory: function (edition) { return sb.from('profiles').select('user_id, name, phone').eq('edition', edition).then(must); },

    /* ----- Événements (v5.0 : un événement = un espace) ----- */
    myEvents: function (edition) {
      return Promise.all([
        sb.from('members').select('role, status, answer, answered_at, space_id, spaces(id, name, edition, event_date, archived, kind, created_by)').eq('user_id', user.id).then(must),
        sb.from('member_teams').select('space_id, cat_id, role, cat_name').eq('user_id', user.id).then(function (r) { return r.error ? [] : r.data; }, function () { return []; })
      ]).then(function (a) {
        return a[0].filter(function (r) { return r.spaces && r.spaces.edition === edition && !r.spaces.archived && r.status !== 'draft'; }).map(function (r) {
          return { id: r.space_id, name: r.spaces.name, date: r.spaces.event_date || '', kind: r.spaces.kind, createdBy: r.spaces.created_by, role: r.role, answer: r.answer, answeredAt: r.answered_at,
            teams: a[1].filter(function (t) { return t.space_id === r.space_id; }).map(function (t) { return { cat_id: t.cat_id, role: t.role, cat_name: t.cat_name || '' }; }) };
        });
      });
    },
    answers: function (ids) { return ids.length ? sb.from('members').select('space_id, user_id, display_name, status, answer, answered_at').in('space_id', ids).then(must) : Promise.resolve([]); },
    answer: function (sid, a) { return sb.rpc('emp_answer', { p_space: sid, p_answer: a }).then(must); },
    publish: function () { return sb.rpc('emp_publish', { p_space: spaceId }).then(must); },
    useSpace: function (id) { spaceId = id; },
    deleteSpace: function () { return sb.from('spaces').delete().eq('id', spaceId).then(must); },
    loadCats: function (sid) { return sb.from('items').select('id, data').eq('space_id', sid).eq('kind', 'cat').then(must); },
    peopleOf: function (sid) {
      return Promise.all([
        sb.from('members').select('user_id, role, display_name, status').eq('space_id', sid).then(must),
        sb.from('member_teams').select('user_id, cat_id, role, cat_name').eq('space_id', sid).then(must)
      ]).then(function (a) { return { mem: a[0], mt: a[1] }; });
    },
    addPerson: function (uid, name, role) { return sb.from('members').upsert({ space_id: spaceId, user_id: uid, role: role, display_name: name || '', status: 'draft' }, { onConflict: 'space_id,user_id', ignoreDuplicates: true }).then(must); },

    /* ----- Espaces et membres ----- */
    mySpaces: function (edition) {
      return sb.from('members').select('role, cat_id, space_id, spaces(id, name, edition, org_name)').eq('user_id', user.id).then(must).then(function (rows) {
        return rows.filter(function (r) { return r.spaces && r.spaces.edition === edition; }).map(function (r) { return { id: r.space_id, name: r.spaces.name, orgName: r.spaces.org_name, role: r.role, catId: r.cat_id }; });
      });
    },
    createSpace: function (edition, name, orgName, extra) {
      var id = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g, function () { return (Math.random() * 16 | 0).toString(16); }));
      return sb.from('spaces').insert(Object.assign({ id: id, edition: edition, name: name, org_name: orgName || '', created_by: user.id }, extra || {})).then(must).then(function () { return id; });
    },
    openSpace: function (id) {
      spaceId = id;
      return Promise.all([
        sb.from('spaces').select('*').eq('id', id).single().then(must),
        sb.from('members').select('*').eq('space_id', id).eq('user_id', user.id).single().then(must),
        // v4.4 : toutes les équipes de la personne (null si la base n'est pas encore mise à jour)
        sb.from('member_teams').select('cat_id, role').eq('space_id', id).eq('user_id', user.id).then(function (r) { return r.error ? null : r.data; }, function () { return null; })
      ]).then(function (a) { return { space: a[0], me: a[1], teams: a[2] }; });
    },
    updateSpace: function (fields) { return sb.from('spaces').update(fields).eq('id', spaceId).then(must); },
    members: function () { return sb.from('members').select('user_id, role, cat_id, display_name, email, joined_at, status, answer, answered_at').eq('space_id', spaceId).order('joined_at').then(must); },
    setMember: function (uid, fields) { return sb.from('members').update(fields).eq('space_id', spaceId).eq('user_id', uid).then(must); },
    teamMembers: function () { return sb.from('member_teams').select('user_id, cat_id, role, cat_name').eq('space_id', spaceId).then(must); },
    setTeam: function (uid, catId, role, catName) { var r = { space_id: spaceId, user_id: uid, cat_id: catId, role: role }; if (catName != null) r.cat_name = catName; return sb.from('member_teams').upsert(r, { onConflict: 'space_id,user_id,cat_id' }).then(must); },
    removeTeam: function (uid, catId) { return sb.from('member_teams').delete().eq('space_id', spaceId).eq('user_id', uid).eq('cat_id', catId).then(must); },
    removeMember: function (uid) { return sb.from('members').delete().eq('space_id', spaceId).eq('user_id', uid).then(must); },

    /* ----- Invitations ----- */
    createInvite: function (role, catId, label) {
      var a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', code = '';
      var rnd = crypto.getRandomValues ? crypto.getRandomValues(new Uint8Array(10)) : Array.from({ length: 10 }, function () { return Math.random() * 256; });
      for (var i = 0; i < 10; i++) code += a[rnd[i] % a.length];
      return sb.from('invites').insert({ code: code, space_id: spaceId, role: role, cat_id: catId || null, label: label || '' }).then(must).then(function () { return code; });
    },
    invites: function () { return sb.from('invites').select('code, role, cat_id, label, uses, expires_at, created_at').eq('space_id', spaceId).order('created_at', { ascending: false }).then(must); },
    deleteInvite: function (code) { return sb.from('invites').delete().eq('code', code).then(must); },
    inviteInfo: function (code) { return sb.rpc('emp_invite_info', { p_code: code }).then(must); },
    acceptInvite: function (code, name) { return sb.rpc('emp_accept_invite', { p_code: code, p_name: name || '' }).then(must); },

    /* ----- Éléments ----- */
    loadItems: function () {
      var out = [], size = 1000;
      function page(from) {
        return sb.from('items').select('kind, id, event_id, cat_id, data, updated_at').eq('space_id', spaceId).neq('kind', 'log').order('kind').order('id').range(from, from + size - 1).then(must).then(function (rows) {
          out = out.concat(rows);
          return rows.length === size ? page(from + size) : null;
        });
      }
      return page(0).then(function () {
        return sb.from('items').select('kind, id, event_id, cat_id, data, updated_at').eq('space_id', spaceId).eq('kind', 'log').order('updated_at', { ascending: false }).limit(400).then(must);
      }).then(function (logs) { return out.concat(logs); });
    },
    upsert: function (rows) {
      if (!rows.length) return Promise.resolve();
      var chunks = [];
      for (var i = 0; i < rows.length; i += 400) chunks.push(rows.slice(i, i + 400));
      return chunks.reduce(function (p, c) {
        return p.then(function () {
          return sb.from('items').upsert(c.map(function (r) { return { space_id: spaceId, kind: r.kind, id: r.id, event_id: r.event_id, cat_id: r.cat_id, data: r.data }; }), { onConflict: 'space_id,kind,id' }).then(must);
        });
      }, Promise.resolve());
    },
    remove: function (keys) {
      var byKind = {};
      keys.forEach(function (k) { var i = k.indexOf('|'); (byKind[k.slice(0, i)] = byKind[k.slice(0, i)] || []).push(k.slice(i + 1)); });
      return Object.keys(byKind).reduce(function (p, kind) {
        return p.then(function () { return sb.from('items').delete().eq('space_id', spaceId).eq('kind', kind).in('id', byKind[kind]).then(must); });
      }, Promise.resolve());
    },
    subscribe: function (onRow, onStatus) {
      Cloud.unsubscribe();
      channel = sb.channel('emp-' + spaceId)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'items', filter: 'space_id=eq.' + spaceId }, function (p) { onRow(p.eventType, p.new, p.old); })
        .subscribe(function (st) { if (onStatus) onStatus(st); });
    },
    unsubscribe: function () { if (channel && sb) { sb.removeChannel(channel); } channel = null; },

    /* ----- Fichiers ----- */
    upload: function (id, blob) { return sb.storage.from(BUCKET).upload(spaceId + '/' + id, blob, { upsert: false, contentType: blob.type || 'application/octet-stream' }).then(function (r) { if (r.error && !/exists|Duplicate/i.test(r.error.message || '')) throw r.error; }); },
    download: function (id, sid) { return sb.storage.from(BUCKET).download((sid || spaceId) + '/' + id).then(must); },
    removeFile: function (id) { return sb.storage.from(BUCKET).remove([spaceId + '/' + id]).then(must); }
  };
  window.Cloud = Cloud;
})();
